<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE CO MEDIA — Campagnes</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f5f4f1;--bg3:#eeecea;--bg4:#e7e5e2;
  --text:#111110;--text2:#636058;--text3:#a09d97;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.15);
  --success:#1a6b35;--success-bg:#e8f5ec;--success-bd:#3aaa60;
  --warning:#7a4500;--warning-bg:#fff4e0;--warning-bd:#e09000;
  --danger:#8b1a1a;--danger-bg:#fff0f0;--danger-bd:#d93025;
  --info:#0a4f8c;--info-bg:#e8f2fd;--info-bd:#3b82f6;
  --sidebar:224px;--r:8px;--rl:12px;--rxl:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  --mono:"SF Mono","Fira Code",Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 4px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--bg2:#222220;--bg3:#2a2a27;--bg4:#323230;
  --text:#e8e6df;--text2:#9a9891;--text3:#636158;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --success:#6fcf97;--success-bg:#0d2e1a;--success-bd:#27ae60;
  --warning:#f6c567;--warning-bg:#2d1800;--warning-bd:#e09000;
  --danger:#f08080;--danger-bg:#2e0d0d;--danger-bd:#d93025;
  --info:#7bb8f5;--info-bg:#061e38;--info-bd:#3b82f6;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 2px 8px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg3);line-height:1.5;-webkit-font-smoothing:antialiased}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:60;overflow:hidden}
.sidebar-logo{padding:24px 16px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo-title{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:-.3px;color:var(--text);line-height:1.2}
.sidebar-logo-sub{font-size:11px;color:var(--text3);margin-top:3px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);padding:16px 16px 4px}
.sidebar-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--text2);font-family:var(--font);cursor:pointer;border-radius:0;transition:all .12s;text-align:left;line-height:1.4;position:relative}
.sidebar-btn:hover{background:var(--bg2);color:var(--text)}
.sidebar-btn.active{background:var(--bg2);color:var(--text);font-weight:600}
.sidebar-btn.active::before{content:\'\';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--info-bd);border-radius:0 2px 2px 0}
.sidebar-btn .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sidebar-sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--success-bd)}.sync-dot.saving{background:var(--warning-bd)}.sync-dot.err{background:var(--danger-bd)}.sync-dot.off{background:var(--text3)}
.main-content{margin-left:var(--sidebar);flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{max-width:1040px;margin:0 auto;padding:32px 24px}
.page{display:none}.page.active{display:block}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:16px 24px;margin-bottom:16px;box-shadow:var(--shadow);transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-md)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:12px;margin-bottom:24px}
.metric{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:16px;box-shadow:var(--shadow)}
.metric-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:8px}
.metric-value{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text);letter-spacing:-.5px;line-height:1}
.metric-sub{font-size:11px;color:var(--text3);margin-top:6px}
.pos{color:var(--success)!important}.neg{color:var(--danger)!important}.warn{color:var(--warning)!important}
h2{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.4px;margin-bottom:24px;color:var(--text)}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px;padding-left:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
.badge::before{content:\'\';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-en-cours{background:var(--info-bg);color:var(--info-bd)}.badge-en-cours::before{background:var(--info-bd)}
.badge-termine{background:var(--success-bg);color:var(--success)}.badge-termine::before{background:var(--success-bd)}
.badge-en-attente{background:var(--warning-bg);color:var(--warning)}.badge-en-attente::before{background:var(--warning-bd)}
.badge-annule{background:var(--bg2);color:var(--text3)}.badge-annule::before{background:var(--text3)}
.badge-paye{background:var(--success-bg);color:var(--success)}.badge-paye::before{background:var(--success-bd)}
.badge-attente{background:var(--warning-bg);color:var(--warning)}.badge-attente::before{background:var(--warning-bd)}
.badge-retard{background:var(--danger-bg);color:var(--danger)}.badge-retard::before{background:var(--danger-bd)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;font-family:var(--font);transition:all .12s;line-height:1;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--text)}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn-primary:hover{opacity:.85;background:var(--text)}
.btn-danger{color:var(--danger);border-color:var(--danger-bd)}.btn-danger:hover{background:var(--danger-bg)}
.btn-success{color:var(--success);border-color:var(--success-bd);background:var(--success-bg)}.btn-success:hover{opacity:.87}
.btn-sm{padding:5px 10px;font-size:12px}.btn-icon{padding:6px 8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-row.single{grid-template-columns:1fr}.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px;position:relative}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2)}
.field input,.field select{font-size:13px;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);width:100%;font-family:var(--font);transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus{outline:none;border-color:var(--info-bd);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.field input::placeholder{color:var(--text3)}.hint{font-size:11px;color:var(--text3);margin-top:4px}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:200;max-height:200px;overflow-y:auto}
.ac-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:.5px solid var(--border)}
.ac-item:last-child{border-bottom:none}.ac-item:hover,.ac-item.selected{background:var(--bg2)}
.ac-item mark{background:transparent;color:var(--text);font-weight:700}
.table-wrap{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
thead{background:var(--bg2)}
th{text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:.5px solid var(--border);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--bg2)}
.td-main{font-weight:500}.td-sub{font-size:11px;color:var(--text2);margin-top:2px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:all .12s;font-weight:500}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.chip:hover:not(.active){border-color:var(--text);color:var(--text)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{background:var(--bg);border-radius:var(--rxl);border:1px solid var(--border);padding:24px;width:100%;max-width:660px;margin:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border);letter-spacing:-.2px}
.stog{display:inline-flex;border-radius:var(--r);overflow:hidden;border:1px solid var(--border2)}
.stog button{padding:5px 10px;border:none;border-right:1px solid var(--border2);background:var(--bg);cursor:pointer;color:var(--text2);transition:all .12s;white-space:nowrap;font-family:var(--font);font-size:12px;font-weight:500;line-height:1.4}
.stog button:last-child{border-right:none}
.stog button:hover:not(.is-active){background:var(--bg2);color:var(--text)}
.stog button.is-active.c-attente{background:var(--warning-bg);color:var(--warning);font-weight:700}
.stog button.is-active.c-retard{background:var(--danger-bg);color:var(--danger);font-weight:700}
.stog button.is-active.c-paye{background:var(--success-bg);color:var(--success);font-weight:700}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 16px;color:var(--text3);gap:16px;text-align:center}
.empty-state-icon{width:48px;height:48px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text2);border:1px solid var(--border)}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:32px}
.progress-bar{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .4s ease}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.sub-section{margin-top:24px;padding-top:24px;border-top:1px solid var(--border)}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg2);color:var(--text2);border:.5px solid var(--border2);font-weight:500}
.alert{padding:12px 16px;border-radius:var(--r);font-size:13px;margin-bottom:16px;line-height:1.6}
.alert-danger{background:var(--danger-bg);color:var(--danger);border-left:3px solid var(--danger-bd)}
.alert-warning{background:var(--warning-bg);color:var(--warning);border-left:3px solid var(--warning-bd)}
.alert-info{background:var(--info-bg);color:var(--info-bd);border-left:3px solid var(--info-bd)}
.date-il{font-size:12px;padding:5px 9px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);width:116px;font-family:var(--mono)}
.date-il:focus{outline:none;border-color:var(--info-bd)}
.date-il::placeholder{color:var(--text3);font-family:var(--font)}
.row-paye td{opacity:.5}
.pb{margin-bottom:24px}.pb-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:8px}
.actions-cell{display:flex;gap:4px;align-items:center}
.amount-pos{color:var(--success);font-weight:600}.amount-neg{color:var(--danger);font-weight:600}
.retro-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--warning-bg);color:var(--warning);border:.5px solid var(--warning-bd);font-weight:600}
.month-band{background:var(--info-bg);border-left:4px solid var(--info-bd);border-radius:var(--r);padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.month-band-title{font-size:14px;font-weight:700;color:var(--info-bd)}
.month-band-right{font-size:13px;font-weight:600;color:var(--danger)}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-title">ONE CO MEDIA</div>
      <div class="sidebar-logo-sub" id="hdr-sub">Chargement...</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Opérations</div>
      <button class="sidebar-btn active" onclick="showPage('campagnes')"><span class="icon">📋</span>Campagnes</button>
      <button class="sidebar-btn" onclick="showPage('createurs')"><span class="icon">👤</span>Créateurs</button>
      <div class="sidebar-section">Finance</div>
      <button class="sidebar-btn" onclick="showPage('paiements')"><span class="icon">💳</span>Paiements</button>
      <button class="sidebar-btn" onclick="showPage('retrocessions')"><span class="icon">🔄</span>Rétrocessions</button>
      <button class="sidebar-btn" onclick="showPage('oneco')"><span class="icon">🧾</span>ONE CO &amp; TVA</button>
      <div class="sidebar-section">Synthèse</div>
      <button class="sidebar-btn" onclick="showPage('dashboard')"><span class="icon">📊</span>Tableau de bord</button>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-sync">
        <span class="sync-dot off" id="sync-dot"></span>
        <span id="sync-status">Non connecté</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <button class="btn btn-sm" style="flex:1;justify-content:center" onclick="openSyncSettings()">☁ Sync</button>
        <button class="btn btn-sm btn-success" style="flex:1;justify-content:center" onclick="exportExcel()">↓ Excel</button>
      </div>
      <button class="btn btn-sm" style="width:100%;justify-content:center;background:var(--info-bg);color:var(--info-bd);border-color:var(--info-bd)" onclick="backupJSON()">💾 Backup JSON</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="wrap">
      <div id="page-campagnes" class="page active"></div>
      <div id="page-createurs" class="page"></div>
      <div id="page-paiements" class="page"></div>
      <div id="page-retrocessions" class="page"></div>
      <div id="page-oneco" class="page"></div>
      <div id="page-dashboard" class="page"></div>
    </div>
  </main>
</div>

async function startSyncPolling(){if(window._syncPoll)clearInterval(window._syncPoll);if(!syncCfg.apiKey||!syncCfg.binId)return;window._syncPoll=setInterval(async()=>{if(!syncCfg.apiKey||!syncCfg.binId)return;setSyncStatus('saving','Verification...');try{const r=await fetch(`https://api.jsonbin.io/v3/b/${syncCfg.binId}/latest`,{headers:{'X-Master-Key':syncCfg.apiKey}});if(!r.ok)return;const j=await r.json();const cloudData=j.record;const cloudTs=cloudData._lastModified||0;const localTs=D._lastModified||0;if(cloudTs>localTs){D=cloudData;migrateD();saveLocalSilent();autoTermineAll();updateHeader();const activePage=document.querySelector('.sidebar-btn.active');if(activePage){const pn=activePage.getAttribute('onclick').match(/'([^']+)'/)?.[1];if(pn)({campagnes:renderCampagnes,createurs:renderCreateurs,paiements:renderPaiements,retrocessions:renderRetrocessions,oneco:renderOneco,dashboard:renderDashboard})[pn]?.();}setSyncStatus('ok','Mis a jour '+(new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));}else{setSyncStatus('ok','Synchronise '+(new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));}}catch(e){setSyncStatus('err','Erreur reseau');}},30000);}
async function createBin(){if(!syncCfg.apiKey)return null;try{const r=await fetch('https://api.jsonbin.io/v3/b',{method:'POST',headers:{'Content-Type':'application/json','X-Master-Key':syncCfg.apiKey,'X-Bin-Name':'influence-campagnes'},body:JSON.stringify(D)});if(r.ok){const j=await r.json();return j.metadata.id;}return null;}catch(e){return null;}}
function save(){saveLocal();updateHeader();if(syncCfg.apiKey&&syncCfg.binId){clearTimeout(saveTimer);saveTimer=setTimeout(pushToCloud,1500);}}
async function refreshCurrentPage(){const activePage=document.querySelector('.sidebar-btn.active');if(activePage){const pageName=activePage.getAttribute('onclick').match(/'([^']+)'/)?.[1];if(pageName)({campagnes:renderCampagnes,createurs:renderCreateurs,paiements:renderPaiements,retrocessions:renderRetrocessions,oneco:renderOneco,dashboard:renderDashboard})[pageName]?.();}}
async function initSync(){loadSyncCfg();loadLocal();autoTermineAll();updateHeader();renderCampagnes();autoBackupIfNeeded();setTimeout(async()=>{await pullFromCloudOnStart();updateHeader();refreshCurrentPage();startSyncPolling();},500);}
async function pullFromCloudOnStart(){if(!syncCfg.apiKey||!syncCfg.binId)return;setSyncStatus('saving','Connexion...');try{const r=await fetch(`https://api.jsonbin.io/v3/b/${syncCfg.binId}/latest`,{headers:{'X-Master-Key':syncCfg.apiKey}});if(!r.ok){setSyncStatus('err','Erreur sync ('+r.status+')');return;}const j=await r.json();const cloudData=j.record;const cloudTs=cloudData._lastModified||0;const localTs=D._lastModified||0;if(cloudTs>localTs){D=cloudData;migrateD();saveLocalSilent();autoTermineAll();setSyncStatus('ok','Synchronise '+(new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));}else{setSyncStatus('saving','Envoi donnees locales...');await pushToCloud();}}catch(e){setSyncStatus('err','Erreur reseau');}}
async function openSyncSettings(){document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModalIfBg(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-title"><span>Synchronisation cloud</span><button class="btn btn-sm" onclick="closeModal()">&#x2715;</button></div><div class="alert alert-info" style="margin-bottom:1.25rem"><strong>Pour partager avec ta femme :</strong><br>1. Compte gratuit sur <strong>jsonbin.io</strong><br>2. Profil &#x2192; <strong>API Keys</strong> &#x2192; copie ta <em>Master Key</em><br>3. Colle ci-dessous et clique "Connecter"<br>4. Donne la meme cle + ID bin a ta femme</div><div class="form-row single"><div class="field"><label>Master Key JSONbin</label><input id="sc-key" value="${syncCfg.apiKey}" placeholder="$2a$10$..." oninput="syncCfg.apiKey=this.value;saveSyncCfg()"></div></div><div class="form-row single"><div class="field"><label>ID du bin (laisse vide pour en creer un nouveau)</label><input id="sc-bin" value="${syncCfg.binId}" placeholder="Sera genere automatiquement" oninput="syncCfg.binId=this.value;saveSyncCfg()"></div></div><div id="sc-msg" style="font-size:12px;color:var(--text2);margin-bottom:.75rem;min-height:18px"></div>${syncCfg.apiKey&&syncCfg.binId?`<div style="background:var(--bg2);border-radius:var(--r);padding:10px 14px;margin:12px 0;font-size:12px"><div style="font-weight:600;color:var(--text);margin-bottom:6px">Config a copier :</div><div style="font-family:var(--mono);font-size:11px;color:var(--text2);user-select:all;word-break:break-all;margin-bottom:3px">Cle : ${syncCfg.apiKey}</div><div style="font-family:var(--mono);font-size:11px;color:var(--text2);user-select:all">Bin : ${syncCfg.binId}</div></div>`:''}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Annuler</button>${syncCfg.binId?`<button class="btn btn-danger btn-sm" onclick="disconnectSync()">Deconnecter</button>`:''}<button class="btn btn-primary" onclick="connectSync()">Connecter</button></div>${syncCfg.binId?`<div style="margin-top:1rem;padding:.75rem;background:var(--bg2);border-radius:var(--r);font-size:12px"><strong>ID a communiquer :</strong><br><code style="font-family:var(--mono);font-size:11px;word-break:break-all">${syncCfg.binId}</code></div>`:''}</div></div>`;}
async function connectSync(){const key=document.getElementById('sc-key').value.trim();const binId=document.getElementById('sc-bin').value.trim();const msg=document.getElementById('sc-msg');if(!key){msg.textContent='La cle API est requise.';return;}msg.textContent='Connexion en cours...';syncCfg.apiKey=key;if(binId){syncCfg.binId=binId;saveSyncCfg();const ok=await pullFromCloud();if(ok){msg.textContent='Connecte ! Donnees chargees depuis le cloud.';setTimeout(()=>{closeModal();showPage('campagnes');},1200);}else{msg.textContent='Erreur : verifiez la cle et l\'ID du bin.';}}else{msg.textContent='Creation du bin...';const id=await createBin();if(id){syncCfg.binId=id;saveSyncCfg();msg.textContent='Bin cree ! ID : '+id;openSyncSettings();}else{msg.textContent='Erreur lors de la creation du bin.';}}}
function disconnectSync(){syncCfg={apiKey:'',binId:''};saveSyncCfg();setSyncStatus('off','Non connecte');closeModal();}

// ─── UTILS ────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function today(){return new Date().toISOString().split('T')[0];}
function fmt(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);}
function fmtD(d){if(!d)return'--';const[y,m,j]=d.split('-');return`${j}/${m}/${y}`;}
function addDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];}
function isOverdue(ech,paid){return!paid&&ech&&ech<today();}
function crHT(cr){return cr.montant_ht||0;}
function isFakeFC(f){return !f.numero||f.numero.trim().toUpperCase()==='FC';}
function getRealFC(cid){return getFcByCamp(cid).filter(f=>!isFakeFC(f));}
function campColor(cid){const realFc=getRealFC(cid);if(!realFc.length)return{bar:'#3b82f6',badge_bg:'#eff6ff',badge_text:'#1d4ed8',label:'A facturer',warn:null};const retard=realFc.some(f=>f.statut==='retard');const paye=realFc.every(f=>f.statut==='paye');if(paye)return{bar:'#22c55e',badge_bg:'#f0fdf4',badge_text:'#15803d',label:'Payee',warn:null};if(retard)return{bar:'#ef4444',badge_bg:'#fff1f2',badge_text:'#b91c1c',label:'Retard',warn:'retard'};return{bar:'#f97316',badge_bg:'#fff7ed',badge_text:'#c2410c',label:'En attente',warn:null};}
function hasPOWarn(cid){const realFc=getRealFC(cid);return realFc.length>0&&realFc.some(f=>!f.po);}
function crTTC(cr){return cr.tva?(Math.round((cr.montant_ht||0)*1.2)):(cr.montant_ht||0);}
function getCamp(id){return D.campagnes.find(c=>c.id===id)||{};}
function getCrByCamp(cid){return D.createurs.filter(c=>c.campagne_id===cid);}
function getFrByCamp(cid){return D.frais.filter(f=>f.campagne_id===cid);}
function getFcByCamp(cid){return D.factures_clients.filter(f=>f.campagne_id===cid);}
function getACData(field){const set=new Set();D.createurs.forEach(c=>{if(field==='emetteur'&&c.emetteur)set.add(c.emetteur);if(field==='createur'&&c.createur)set.add(c.createur);if(field==='iban'&&c.iban)set.add(c.iban);if(field==='bic'&&c.bic)set.add(c.bic);});return[...set];}
function getBankForName(val,field){const lv=val.toLowerCase();const match=D.createurs.find(c=>{const name=(field==='emetteur'?c.emetteur:c.createur)||'';return name.toLowerCase()===lv&&(c.iban||c.bic);});return match?{iban:match.iban||'',bic:match.bic||''}:null;}
function fillBankFields(val,field){const bank=getBankForName(val,field);if(!bank)return;const ibanEl=document.getElementById('cr-iban');const bicEl=document.getElementById('cr-bic');if(ibanEl&&!ibanEl.value&&bank.iban)ibanEl.value=bank.iban;if(bicEl&&!bicEl.value&&bank.bic)bicEl.value=bank.bic;}
function setupAC(inputId,field){const inp=document.getElementById(inputId);if(!inp)return;let idx=-1;function show(val){const existing=document.getElementById('ac-'+inputId);if(existing)existing.remove();if(!val)return;const items=getACData(field).filter(x=>x.toLowerCase().startsWith(val.toLowerCase())&&x.toLowerCase()!==val.toLowerCase());if(!items.length)return;const list=document.createElement('div');list.id='ac-'+inputId;list.className='ac-list';items.forEach((it)=>{const d=document.createElement('div');d.className='ac-item';const bank=(field==='emetteur'||field==='createur')?getBankForName(it,field):null;d.innerHTML=`<div><mark>${val}</mark>${it.slice(val.length)}</div>${bank&&bank.iban?`<div style="font-size:11px;color:var(--text3);font-family:var(--mono)">${bank.iban}</div>`:''}`; d.onmousedown=e=>{e.preventDefault();inp.value=it;list.remove();idx=-1;if(field==='emetteur'||field==='createur')fillBankFields(it,field);if(field==='emetteur'&&inp._autofill)inp._autofill(it);};list.appendChild(d);});idx=-1;inp.parentNode.appendChild(list);}inp.addEventListener('input',()=>{show(inp.value);});inp.addEventListener('blur',()=>{setTimeout(()=>{const l=document.getElementById('ac-'+inputId);if(l)l.remove();},150);if(field==='emetteur'||field==='createur')fillBankFields(inp.value,field);});inp.addEventListener('keydown',e=>{const list=document.getElementById('ac-'+inputId);if(!list)return;const items=list.querySelectorAll('.ac-item');if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,items.length-1);items.forEach((x,i)=>x.classList.toggle('selected',i===idx));}else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,-1);items.forEach((x,i)=>x.classList.toggle('selected',i===idx));}else if(e.key==='Enter'&&idx>=0){e.preventDefault();const txt=items[idx].querySelector('div')?.textContent||items[idx].textContent;inp.value=txt;list.remove();idx=-1;if(field==='emetteur'||field==='createur')fillBankFields(txt,field);if(field==='emetteur'&&inp._autofill)inp._autofill(txt);}else if(e.key==='Escape'){list.remove();idx=-1;}});}
function calcRetroRestant(){let provisionne=0;D.campagnes.forEach(c=>{const fc=getFcByCamp(c.id);const ca=fc.reduce((s,f)=>s+f.montant_ht,0);provisionne+=ca*(c.retrocession_pct||0)/100;});const utilise=D.retrocessions_paiements.reduce((s,p)=>s+p.montant_ht,0);return{provisionne,utilise,restant:provisionne-utilise};}
function calcMarge(cid){const fc=getFcByCamp(cid),crs=getCrByCamp(cid),fr=getFrByCamp(cid);const camp=getCamp(cid);const realFc=fc.filter(f=>!isFakeFC(f));const ca_ht_fact=realFc.reduce((s,f)=>s+f.montant_ht,0);const ca_ht=ca_ht_fact||(camp.budget_ht||0);const ca_reel=ca_ht_fact>0;const createurs=crs.reduce((s,c)=>s+c.montant_ht,0);const createurs_payes=crs.filter(c=>c.statut==='paye').reduce((s,c)=>s+c.montant_ht,0);const frais=fr.reduce((s,f)=>s+f.montant_ht,0);const frais_payes=fr.filter(f=>f.paye).reduce((s,f)=>s+f.montant_ht,0);const retro=ca_ht*(camp.retrocession_pct||0)/100;const charges=createurs+frais+retro;const charges_payees=createurs_payes+frais_payes;return{ca_ht,ca_reel,ca_ht_fact,createurs,createurs_payes,frais,frais_payes,retro,charges,charges_payees,marge:ca_ht-charges};}
function updateHeader(){const sub=document.getElementById('hdr-sub');if(!sub)return;const nb=D.campagnes.length;const ca=D.factures_clients.reduce((s,f)=>s+f.montant_ht,0);const retards=D.factures_clients.filter(f=>f.statut==='retard').length;let t=`${nb} campagne${nb>1?'s':''}`;if(ca)t+=` - CA : ${fmt(ca)}`;if(retards)t+=` - ${retards} en retard`;document.getElementById('hdr-sub').textContent=t;}

function renderCampagnes(){const el=document.getElementById('page-campagnes');let filtered=curFilter==='tous'?D.campagnes:D.campagnes.filter(c=>c.statut===curFilter);if(searchCamp.trim()){const q=searchCamp.trim().toLowerCase();filtered=filtered.filter(c=>(c.nom||'').toLowerCase().includes(q)||(c.agence||'').toLowerCase().includes(q));}const chips=[{v:'tous',l:'Toutes'},{v:'en-cours',l:'En cours'},{v:'en-attente',l:'En attente'},{v:'termine',l:'Terminee'},{v:'annule',l:'Annulee'}].map(f=>`<span class="chip ${curFilter===f.v?'active':''}" onclick="setFilter('${f.v}')">${f.l}</span>`).join('');const MOIS_FR=['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];function campMoisKey(c){const fc=getFcByCamp(c.id);const d=fc.length?fc[0].date_emission:c.date_facture_emission;return d?d.slice(0,7):'9999-13';}function moisLabel(key){if(!key||key==='9999-13')return'Sans date';const[y,m]=key.split('-');return`${MOIS_FR[parseInt(m,10)-1]} ${y}`;}const byMois={};filtered.forEach(c=>{const mk=campMoisKey(c);if(!byMois[mk])byMois[mk]=[];byMois[mk].push(c);});el.innerHTML=`<div class="section-header"><h2 style="margin:0">Campagnes</h2><button class="btn btn-primary" onclick="openModalCamp()">+ Nouvelle campagne</button></div><div style="position:relative;margin-bottom:.75rem;max-width:380px"><input id="search-camp" type="text" value="${searchCamp.replace(/"/g,'&quot;')}" placeholder="Rechercher une campagne, une agence..." style="width:100%;padding:7px 32px 7px 11px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:var(--font)" oninput="searchCamp=this.value;renderCampagnes()" onkeydown="if(event.key==='Escape'){searchCamp='';this.value='';renderCampagnes()}">${searchCamp?`<button onclick="searchCamp='';renderCampagnes()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;padding:0">x</button>`:''}</div><div class="chip-row">${chips}</div>${D.campagnes.length===0?`<div class="card"><div class="empty-state"><div class="empty-state-icon">+</div><p style="font-weight:500;color:var(--text)">Aucune campagne</p><button class="btn btn-primary" onclick="openModalCamp()">+ Nouvelle campagne</button></div></div>`:''}${!searchCamp&&D.campagnes.length>0&&filtered.length===0?`<div class="empty">Aucune campagne dans ce statut</div>`:''}${searchCamp&&filtered.length===0?`<div class="empty">Aucun resultat</div>`:''}${Object.keys(byMois).sort().map(mk=>{const camps=byMois[mk];return`<div style="margin-bottom:40px"><div style="background:var(--bg2);border-radius:var(--r);padding:12px 20px;margin-bottom:16px;display:flex;align-items:baseline;justify-content:space-between;gap:16px"><div style="display:flex;align-items:baseline;gap:10px"><div style="font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px;line-height:1">${moisLabel(mk).split(' ')[0]}</div><div style="font-size:13px;font-weight:500;color:var(--text2)">${moisLabel(mk).split(' ')[1]||''}</div></div><div style="font-size:12px;color:var(--text3);font-weight:500">${camps.length} operation${camps.length>1?'s':''}</div></div>${camps.map(c=>{const m=calcMarge(c.id);const pct=m.ca_ht?Math.round(m.marge/m.ca_ht*100):0;const col=pct>=20?'var(--success)':pct>=10?'var(--warning)':'var(--danger)';const fc=getFcByCamp(c.id);const cc=campColor(c.id);const poWarn=hasPOWarn(c.id);return`<div style="background:var(--bg);border:1px solid var(--border);border-left:3px solid ${cc.bar};border-radius:var(--rl);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .15s" onmouseenter="this.style.boxShadow='var(--shadow-md)'" onmouseleave="this.style.boxShadow='var(--shadow)'"><div style="padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--border)" onclick="openCampDetail('${c.id}')"><div style="fl function openFicheCreateur(emetteur){const lignes=D.createurs.filter(cr=>(cr.emetteur||cr.nom||'')===emetteur);if(!lignes.length)return;const ref=lignes[0];const ct=(D.contrats&&D.contrats[ref.id])||{};const ctAll=lignes.map(cr=>(D.contrats&&D.contrats[cr.id])||{});const ctRef=ctAll.find(c=>c.adresse||c.siret)||ct;document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModalIfBg(event)"><div class="modal" style="max-width:740px" onclick="event.stopPropagation()"><div class="modal-title"><div><div style="font-size:17px;font-weight:700">${emetteur}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${ref.createur||ref.handle||''} - ${lignes.length} operation${lignes.length>1?'s':''}</div></div><button class="btn btn-sm" onclick="closeModal()">&#x2715;</button></div><div style="background:var(--info-bg);border-left:3px solid var(--info-bd);border-radius:var(--r);padding:8px 14px;margin-bottom:14px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--info-bd)">1 - L'Entite</div></div><div class="form-row"><div class="field"><label>Emetteur</label><input id="fc-em" value="${(ref.emetteur||ref.nom||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>Createur (pseudo)</label><input id="fc-cr" value="${(ref.createur||ref.handle||'').replace(/"/g,'&quot;')}"></div></div><div class="form-row single"><div class="field"><label>Adresse</label><input id="fc-adresse" value="${(ctRef.adresse||'').replace(/"/g,'&quot;')}" placeholder="15 rue des Lilas, 75001 Paris"></div></div><div class="form-row"><div class="field"><label>SIRET / SIREN</label><input id="fc-siret" value="${(ctRef.siret||'').replace(/"/g,'&quot;')}" placeholder="SIRET (14 chiffres) ou SIREN (9 chiffres)"></div><div class="field"><label>N TVA intracommunautaire</label><input id="fc-tva-intra" value="${(ctRef.tva_intra||'').replace(/"/g,'&quot;')}" placeholder="FR00000000000"></div></div><div style="background:var(--success-bg);border-left:3px solid var(--success-bd);border-radius:var(--r);padding:8px 14px;margin:14px 0"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--success)">2 - Paiement</div></div><div class="form-row"><div class="field"><label>IBAN</label><input id="fc-iban" value="${(ref.iban||'').replace(/"/g,'&quot;')}"></div><div class="field"><label>BIC</label><input id="fc-bic" value="${(ref.bic||'').replace(/"/g,'&quot;')}"></div></div><div class="form-row single"><div class="field"><label>TVA</label><select id="fc-tva"><option value="0"${!ref.tva?' selected':''}>Non assujetti (TTC = HT)</option><option value="1"${ref.tva?' selected':''}>Assujetti - 20%</option></select></div></div><div style="background:var(--warning-bg);border-left:3px solid var(--warning-bd);border-radius:var(--r);padding:8px 14px;margin:14px 0"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--warning)">3 - Operations (${lignes.length})</div></div><div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r)">${lignes.map((cr,i)=>{const camp=getCamp(cr.campagne_id);const ctCr=(D.contrats&&D.contrats[cr.id])||{};const stContrat=cr.montant_ht>=1000?getContratStatut(ctCr.statut||'devis_valide'):null;const cc=campColor(cr.campagne_id);return`<div style="padding:12px 14px;border-bottom:${i<lignes.length-1?'1px solid var(--border)':'none'};background:var(--bg)"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px"><div><span style="font-weight:600;font-size:13px;background:${cc.badge_bg};color:${cc.badge_text};border-radius:4px;padding:2px 8px;border-left:2px solid ${cc.bar}">${camp.nom||'--'}</span><span style="font-size:12px;color:var(--text2);margin-left:8px">${camp.agence||'--'}</span></div><div style="display:flex;gap:6px;align-items:center">${stContrat?`<span style="background:${stContrat.bg};color:${stContrat.color};font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px">${stContrat.label}</span>`:''}<span class="badge badge-${cr.statut}">${cr.statut}</span></div></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12px;color:var(--text2)"><span><strong style="color:var(--text)">${fmt(cr.montant_ht)} HT</strong>${cr.tva?`<br>${fmt(Math.round(cr.montant_ht*1.2))} TTC`:''}</span><span>${cr.nb_contenus||1}x ${cr.type_contenus||'--'}</span><span>${cr.ref_facture||'--'}</span><span>Ech. ${fmtD(cr.date_paiement_souhaite)||'--'}</span></div></div>`;}).join('')}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px"><button class="btn" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="saveFicheCreateur('${emetteur.replace(/'/g,"'")}')">Enregistrer</button></div></div></div>`;}
function saveFicheCreateur(emetteur){const lignes=D.createurs.filter(cr=>(cr.emetteur||cr.nom||'')===emetteur);if(!lignes.length)return;const newEm=document.getElementById('fc-em').value.trim();const newCr=document.getElementById('fc-cr').value.trim();const newIban=document.getElementById('fc-iban').value.trim();const newBic=document.getElementById('fc-bic').value.trim();const newTva=document.getElementById('fc-tva').value==='1';const adresse=document.getElementById('fc-adresse').value.trim();const siret=document.getElementById('fc-siret').value.trim();const tva_intra=document.getElementById('fc-tva-intra').value.trim();lignes.forEach(cr=>{cr.emetteur=newEm;cr.nom=newEm;cr.createur=newCr;cr.handle=newCr;cr.iban=newIban;cr.bic=newBic;cr.tva=newTva;const ct=getContrat(cr.id)||{};setContrat(cr.id,{...ct,adresse,siret,tva_intra});});save();openFicheCreateur(newEm);}
function renderCreateurs(){autoFillIban();const el=document.getElementById('page-createurs');const retards=D.createurs.filter(c=>c.statut==='retard');let liste=D.createurs;if(searchCr.trim()){const q=searchCr.trim().toLowerCase();liste=liste.filter(cr=>{const camp=getCamp(cr.campagne_id);return(cr.emetteur||'').toLowerCase().includes(q)||(cr.createur||cr.handle||'').toLowerCase().includes(q)||(camp.nom||'').toLowerCase().includes(q)||(cr.ref_facture||'').toLowerCase().includes(q);});}const emetteurs={};liste.forEach(cr=>{const key=cr.emetteur||cr.nom||cr.id;if(!emetteurs[key])emetteurs[key]={lignes:[],totalHT:0,totalPaye:0};emetteurs[key].lignes.push(cr);emetteurs[key].totalHT+=cr.montant_ht||0;if(cr.statut==='paye')emetteurs[key].totalPaye+=cr.montant_ht||0;});const totalHT=liste.reduce((s,cr)=>s+(cr.montant_ht||0),0);const totalPaye=liste.filter(cr=>cr.statut==='paye').reduce((s,cr)=>s+(cr.montant_ht||0),0);const totalAttente=totalHT-totalPaye;el.innerHTML=`<div class="section-header"><h2 style="margin:0">Createurs</h2></div><div style="position:relative;margin-bottom:1.25rem;max-width:380px"><input id="search-cr" type="text" value="${searchCr.replace(/"/g,'&quot;')}" placeholder="Rechercher emetteur, createur, campagne..." style="width:100%;padding:7px 32px 7px 11px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:var(--font)" oninput="searchCr=this.value;renderCreateurs()" onkeydown="if(event.key==='Escape'){searchCr='';this.value='';renderCreateurs()}">${searchCr?`<button onclick="searchCr='';renderCreateurs()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;padding:0">x</button>`:''}</div>${retards.length>0&&!searchCr?`<div class="alert alert-danger">Paiements en retard : ${retards.map(c=>c.emetteur||c.nom||'').join(', ')}</div>`:''}${D.createurs.length===0?`<div class="card"><div class="empty-state"><div class="empty-state-icon">+</div><p style="font-weight:500;color:var(--text)">Aucun createur</p><p style="font-size:13px">Ajoute des createurs depuis la fiche d'une campagne.</p></div></div>`:liste.length===0?`<div class="empty">Aucun resultat pour "<strong>${searchCr}</strong>"</div>`:`<div class="card"><div class="table-wrap"><table><thead><tr><th style="width:18%">Emetteur</th><th style="width:11%">Pseudo</th><th style="width:10%">Operations</th><th style="width:12%">Total HT</th><th style="width:10%">Paye HT</th><th style="width:20%">IBAN</th><th style="width:10%">Adresse</th><th style="width:9%">Fiche</th></tr></thead><tbody>${Object.keys(emetteurs).map(em=>{const{lignes,totalHT:tHT,totalPaye:tP}=emetteurs[em];const ref=lignes[0];const ctRef=(D.contrats&&D.contrats[ref.id])||{};return`<tr style="cursor:pointer" onclick="openFicheCreateur('${em.replace(/'/g,"'")}')"><td style="font-weight:600">${em}</td><td style="font-size:12px;color:var(--text2)">${ref.createur||ref.handle||'--'}</td><td style="font-size:12px;text-align:center">${lignes.length}</td><td style="font-weight:600">${fmt(tHT)}</td><td style="color:var(--success);font-weight:600">${fmt(tP)}</td><td style="font-size:11px;font-family:var(--mono)">${ref.iban?ref.iban.substring(0,22)+'...':'<span style="color:var(--text3)">--</span>'}</td><td style="font-size:11px">${ctRef.adresse?'<span style="color:var(--success)">&#x2713;</span>':'<span style="color:var(--text3)">--</span>'}</td><td><button class="btn btn-sm" onclick="event.stopPropagation();openFicheCreateur('${em.replace(/'/g,"'")}')">Ouvrir</button></td></tr>`;}).join('')}</tbody></table></div></div>`}${liste.length>0?`<div style="margin-top:1rem;padding:1rem 1.25rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);display:flex;gap:2rem;flex-wrap:wrap;align-items:center"><div><div class="metric-label" style="font-size:10px">${searchCr?`${liste.length} resultat${liste.length>1?'s':''}`:Object.keys(emetteurs).length+' createur'+(Object.keys(emetteurs).length>1?'s':'')}</div><div style="font-size:18px;font-weight:700">${fmt(totalHT)}</div></div><div><div class="metric-label" style="font-size:10px">Paye</div><div style="font-size:16px;font-weight:600;color:var(--success)">${fmt(totalPaye)}</div></div><div><div class="metric-label" style="font-size:10px">Restant</div><div style="font-size:16px;font-weight:600;color:var(--warning)">${fmt(totalAttente)}</div></div></div>`:''}`;const inp=document.getElementById('search-cr');if(inp&&searchCr){const l=inp.value.length;inp.focus();inp.setSelectionRange(l,l);}}

function renderPaiements(){const el=document.getElementById('page-paiements');const MOIS_FR=['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];function moisKey(iso){return iso?iso.slice(0,7):'9999-13';}function moisLabel(key){if(!key||key==='9999-13')return'Sans date';const[y,m]=key.split('-');return`${MOIS_FR[parseInt(m,10)-1]} ${y}`;}const sfc=[...D.factures_clients].sort((a,b)=>(a.date_echeance||'9')>(b.date_echeance||'9')?1:-1);const tEA=D.factures_clients.filter(f=>f.statut!=='paye').reduce((s,f)=>s+f.montant_ttc,0);const tEE=D.factures_clients.filter(f=>f.statut==='paye').reduce((s,f)=>s+f.montant_ttc,0);const tSA=D.createurs.filter(c=>c.statut!=='paye').reduce((s,c)=>s+c.montant_ht,0);const tSP=D.createurs.filter(c=>c.statut==='paye').reduce((s,c)=>s+c.montant_ht,0);const nR=D.factures_clients.filter(f=>f.statut==='retard').length;const byMois={};[...D.createurs].sort((a,b)=>(a.date_paiement_souhaite||'9')>(b.date_paiement_souhaite||'9')?1:-1).forEach(cr=>{const mk=moisKey(cr.date_paiement_souhaite);if(!byMois[mk])byMois[mk]=[];byMois[mk].push(cr);});el.innerHTML=`<h2>Paiements</h2><div class="metrics" style="grid-template-columns:repeat(4,1fr);margin-bottom:1.5rem"><div class="metric"><div class="metric-label">A encaisser TTC</div><div class="metric-value warn">${fmt(tEA)}</div></div><div class="metric"><div class="metric-label">Encaisse TTC</div><div class="metric-value pos">${fmt(tEE)}</div></div><div class="metric"><div class="metric-label">A payer HT</div><div class="metric-value warn">${fmt(tSA)}</div></div><div class="metric"><div class="metric-label">Paye HT</div><div class="metric-value neg">${fmt(tSP)}</div></div></div><div class="sl">Factures clients</div>${nR>0?`<div class="alert alert-danger">&#x26A0; ${nR} facture${nR>1?'s':''} en retard</div>`:''}<div class="card" style="margin-bottom:2rem"><div class="table-wrap"><table><thead><tr><th style="width:20%">Campagne</th><th style="width:13%">N Facture</th><th style="width:10%">N PO</th><th style="width:16%">Montant</th><th style="width:13%">Echeance</th><th style="width:18%">Statut</th><th style="width:10%">Paye le</th></tr></thead><tbody>${sfc.length===0?'<tr><td colspan="7" class="empty">Aucune facture client</td></tr>':sfc.map(f=>{const cc=campColor(f.campagne_id);return`<tr><td><span style="background:${cc.badge_bg};color:${cc.badge_text};font-weight:600;border-radius:4px;padding:1px 7px;font-size:12px;border-left:2px solid ${cc.bar}">${getCamp(f.campagne_id).nom||'--'}</span>${cc.warn?` <span style="background:#E53935;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px">&#x26A0;</span>`:''} ${!f.po?`<span style="background:#F9A825;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px">&#x26A0; PO</span>`:''}</td><td style="font-size:12px;font-family:var(--mono)">${f.numero||'--'}</td><td style="font-size:12px">${f.po||'<span style="color:var(--text3)">--</span>'}</td><td><div class="amount-pos">+${fmt(f.montant_ttc)}</div><div style="font-size:11px;color:var(--text2)">${fmt(f.montant_ht)} HT</div></td><td style="font-size:12px;color:${f.statut==='retard'?'var(--danger)':'inherit'};font-weight:${f.statut==='retard'?600:400}">${fmtD(f.date_echeance)}</td><td>${togFc(f)}</td><td style="font-size:12px;color:var(--success)">${f.date_paiement_reel?fmtD(f.date_paiement_reel):'--'}</td></tr>`;}).join('')}</tbody></table></div></div><div class="sl">Createurs</div>${Object.keys(byMois).sort().map(mk=>{const crs=byMois[mk];const tot=crs.reduce((s,c)=>s+(c.montant_ht||0),0);const payes=crs.filter(c=>c.statut==='paye').reduce((s,c)=>s+(c.montant_ht||0),0);const nbP=crs.filter(c=>c.statut==='paye').length;return`<div style="margin-bottom:1.5rem"><div class="month-band"><div><div class="month-band-title">${moisLabel(mk)}</div><div style="font-size:11px;color:var(--info);margin-top:2px">${nbP}/${crs.length} paye${nbP>1?'s':''}</div></div><div style="text-align:right"><div class="month-band-right">-${fmt(tot)}</div><div style="font-size:11px;color:var(--success);margin-top:2px">paye : ${fmt(payes)}</div></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th style="width:16%">Emetteur</th><th style="width:15%">Campagne</th><th style="width:12%">HT / TTC</th><th style="width:10%">Ref.</th><th style="width:10%">Recue le</th><th style="width:10%">Echeance</th><th style="width:10%">Virement</th><th style="width:17%">Statut</th></tr></thead><tbody>${crs.map(cr=>{const camp=getCamp(cr.campagne_id);const cc=campColor(cr.campagne_id);const vir=D.virements&&D.virements[cr.id]==='saisi';return`<tr><td><div style="font-weight:500;font-size:12px">${cr.emetteur||cr.nom||'--'}</div><div style="font-size:11px;color:var(--text2)">${cr.createur||cr.handle||''}</div></td><td><span style="background:${cc.badge_bg};color:${cc.badge_text};font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;border-left:2px solid ${cc.bar}">${camp.nom||'--'}</span></td><td><div style="font-weight:600">-${fmt(crHT(cr))}</div><div style="font-size:11px;color:var(--text2)">-${fmt(crTTC(cr))} TTC${!cr.tva?' <span class="tag" style="font-size:10px">= HT</span>':''}</div></td><td style="font-size:11px;font-family:var(--mono)">${cr.ref_facture||'--'}</td><td style="font-size:12px">${fmtD(cr.date_facture)||'--'}</td><td style="font-size:12px;color:${isOverdue(cr.date_paiement_souhaite,cr.date_paiement_reel)?'var(--danger)':'inherit'}">${fmtD(cr.date_paiement_souhaite)||'--'}</td><td><button class="btn btn-sm ${vir?'btn-success':''}" onclick="setVirement('${cr.id}','${vir?'non':'saisi'}')">${vir?'&#x2713; Saisi':'A saisir'}</button></td><td>${togCr(cr)}</td></tr>`;}).join('')}</tbody></table></div></div></div>`;}).join('')}`;setTimeout(applyDateMasks,0);}

function renderRetrocessions(){const el=document.getElementById('page-retrocessions');const rv=calcRetroRestant();const pcts=rv.provisionne>0?Math.min(100,Math.round(rv.utilise/rv.provisionne*100)):0;const parAgence={};D.campagnes.forEach(c=>{const m=calcMarge(c.id);const ag=c.agence||'--';if(!parAgence[ag])parAgence[ag]={provisionne:0,utilise:0,campagnes:[]};parAgence[ag].provisionne+=m.retro;parAgence[ag].campagnes.push({nom:c.nom,retro:m.retro,ca:m.ca_ht||c.budget_ht});});D.retrocessions_paiements.forEach(p=>{const ag=p.agence||'--';if(!parAgence[ag])parAgence[ag]={provisionne:0,utilise:0,campagnes:[]};parAgence[ag].utilise+=p.montant_ht;});el.innerHTML=`<div class="section-header"><h2 style="margin:0">Pot de retrocession</h2><button class="btn btn-primary" onclick="openModalRetro()">+ Enregistrer un paiement</button></div><div class="alert alert-info" style="margin-bottom:1rem">Les retrocessions sont provisionnees automatiquement sur chaque campagne (% du CA HT).</div><div class="metrics" style="grid-template-columns:repeat(3,1fr)"><div class="metric"><div class="metric-label">Total provisionne</div><div class="metric-value warn">${fmt(rv.provisionne)}</div></div><div class="metric"><div class="metric-label">Deja utilise</div><div class="metric-value neg">${fmt(rv.utilise)}</div></div><div class="metric"><div class="metric-label">Restant disponible</div><div class="metric-value ${rv.restant>=0?'pos':'neg'}">${fmt(rv.restant)}</div></div></div><div style="margin-bottom:1.75rem"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:4px"><span>Utilisation du pot</span><span>${pcts}%</span></div><div class="progress-bar" style="height:10px"><div class="progress-fill" style="width:${pcts}%;background:${pcts>90?'var(--danger)':pcts>70?'var(--warning)':'var(--success)'}"></div></div></div><div class="sl">Recapitulatif par agence</div><div class="card" style="margin-bottom:1.75rem"><div class="table-wrap"><table><thead><tr><th style="width:18%">Agence</th><th style="width:13%;text-align:right">Prov. HT</th><th style="width:13%;text-align:right">Prov. TTC</th><th style="width:12%;text-align:right">Utilise HT</th><th style="width:12%;text-align:right">Utilise TTC</th><th style="width:12%;text-align:right">Restant HT</th><th style="width:20%">Campagnes</th></tr></thead><tbody>${Object.keys(parAgence).sort().map(ag=>{const row=parAgence[ag];const restant=row.provisionne-row.utilise;return`<tr><td style="font-weight:600">${ag}</td><td style="text-align:right;font-weight:600;color:var(--warning)">${fmt(row.provisionne)}</td><td style="text-align:right;font-size:11px;color:var(--text2)">${fmt(Math.round(row.provisionne*1.2))} TTC</td><td style="text-align:right;font-weight:600;color:var(--danger)">${fmt(row.utilise)}</td><td style="text-align:right;font-size:11px;color:var(--text2)">${fmt(Math.round(row.utilise*1.2))} TTC</td><td style="text-align:right;font-weight:700;color:${restant>=0?'var(--success)':'var(--danger)'}">${fmt(restant)}</td><td style="font-size:11px;color:var(--text2)">${row.campagnes.map(c=>c.nom).join(', ')}</td></tr>`;}).join('')}</tbody><tfoot><tr style="border-top:1px solid var(--border)"><td style="font-weight:700;padding:8px 10px">Total</td><td style="text-align:right;font-weight:700;color:var(--warning);padding:8px 10px">${fmt(rv.provisionne)}</td><td style="text-align:right;font-size:11px;color:var(--text2);padding:8px 10px">${fmt(Math.round(rv.provisionne*1.2))} TTC</td><td style="text-align:right;font-weight:700;color:var(--danger);padding:8px 10px">${fmt(rv.utilise)}</td><td style="text-align:right;font-size:11px;color:var(--text2);padding:8px 10px">${fmt(Math.round(rv.utilise*1.2))} TTC</td><td style="text-align:right;font-weight:700;color:${rv.restant>=0?'var(--success)':'var(--danger)'};padding:8px 10px">${fmt(rv.restant)}</td><td></td></tr></tfoot></table></div></div><div class="sl">Detail par campagne</div><div class="card" style="margin-bottom:1.75rem"><div class="table-wrap"><table><thead><tr><th style="width:32%">Campagne</th><th style="width:16%">Agence</th><th style="width:14%">CA HT</th><th style="width:14%;text-align:right">Provisionne HT</th><th style="width:14%;text-align:right">Provisionne TTC</th><th style="width:10%">Statut</th></tr></thead><tbody>${D.campagnes.map(c=>{const m=calcMarge(c.id);const cc=campColor(c.id);return`<tr><td><span style="background:${cc.badge_bg};color:${cc.badge_text};font-weight:600;border-radius:4px;padding:2px 8px;font-size:12px;border-left:2px solid ${cc.bar}">${c.nom}</span></td><td style="font-size:12px;color:var(--text2)">${c.agence}</td><td style="font-size:12px">${fmt(m.ca_ht)}${!m.ca_reel?' <span style="font-size:10px;color:var(--text3)">(bdgt)</span>':''}</td><td style="text-align:right;font-weight:600;color:var(--warning)">${fmt(m.retro)}</td><td style="text-align:right;font-size:11px;color:var(--text2)">${fmt(Math.round(m.retro*1.2))} TTC</td><td><span class="badge badge-${c.statut}">${c.statut.replace('-',' ')}</span></td></tr>`;}).join('')}</tbody></table></div></div><div class="section-header" style="margin-bottom:.625rem"><div class="sl" style="margin:0">Paiements effectues sur le pot</div></div>${D.retrocessions_paiements.length===0?`<div class="card"><div class="empty">Aucun paiement enregistre</div></div>`:`<div class="card"><div class="table-wrap"><table><thead><tr><th style="width:14%">Date</th><th style="width:34%">Prestataire / Description</th><th style="width:20%">Agence</th><th style="width:17%">Montant HT</th><th style="width:15%;text-align:right">Suppr.</th></tr></thead><tbody>${[...D.retrocessions_paiements].sort((a,b)=>b.date>a.date?1:-1).map(p=>`<tr><td style="font-size:12px">${fmtD(p.date)}</td><td style="font-weight:500">${p.description}</td><td style="font-size:12px;color:var(--text2)">${p.agence||'--'}</td><td><div style="font-weight:600;color:var(--danger)">-${fmt(p.montant_ht)} HT</div><div style="font-size:10px;color:var(--text2)">-${fmt(Math.round(p.montant_ht*1.2))} TTC</div></td><td style="text-align:right"><button class="btn btn-sm btn-danger" onclick="delRetro('${p.id}')">&#x2715;</button></td></tr>`).join('')}</tbody></table></div></div>`}`;}
function openModalRetro(){const agences=[...new Set(D.campagnes.map(c=>c.agence).filter(Boolean))];document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModalIfBg(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-title"><span>Paiement sur le pot de retrocession</span><button class="btn btn-sm" onclick="closeModal()">&#x2715;</button></div><div class="form-row single"><div class="field"><label>Description / Prestataire *</label><input id="rp-desc" placeholder="ex : Seminaire equipe Havas, Hotel Bali..."></div></div><div class="form-row"><div class="field"><label>Montant HT (euros) *</label><input id="rp-mt" type="number" placeholder="ex : 2500"></div><div class="field"><label>Date *</label><input id="rp-date" type="date" value="${today()}"></div></div><div class="form-row single"><div class="field"><label>Agence concernee</label><select id="rp-agence"><option value="">- Toutes / non specifie</option>${agences.map(a=>`<option value="${a}">${a}</option>`).join('')}</select></div></div><div style="background:var(--bg2);border-radius:var(--r);padding:.75rem 1rem;font-size:13px;margin-bottom:1rem">Pot restant disponible : <strong style="color:${calcRetroRestant().restant>=0?'var(--success)':'var(--danger)'}">${fmt(calcRetroRestant().restant)}</strong></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveRetro()">Enregistrer</button></div></div></div>`;}
function saveRetro(){const desc=document.getElementById('rp-desc').value.trim();if(!desc)return alert('Description requise.');const mt=parseFloat(document.getElementById('rp-mt').value)||0;if(!mt)return alert('Montant requis.');D.retrocessions_paiements.push({id:uid(),description:desc,montant_ht:mt,date:document.getElementById('rp-date').value,agence:document.getElementById('rp-agence').value});save();closeModal();renderRetrocessions();}
function delRetro(id){if(!confirm('Supprimer ce paiement du pot ?'))return;D.retrocessions_paiements=D.retrocessions_paiements.filter(x=>x.id!==id);save();renderRetrocessions();}

function renderOneco(){const el=document.getElementById('page-oneco');if(!D.factures_oneco)D.factures_oneco=[];const MOIS_FR=['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];function moisLabel(key){if(!key||key==='9999-13')return'Sans date';const[y,m]=key.split('-');return`${MOIS_FR[parseInt(m,10)-1]} ${y}`;}function moisKey(iso){return iso?iso.slice(0,7):'9999-13';}const tvaCollMap={};D.factures_oneco.filter(f=>f.statut==='paye'&&f.date_paiement_reel).forEach(f=>{const mk=moisKey(f.date_paiement_reel);if(!tvaCollMap[mk])tvaCollMap[mk]={ht:0,tva:0,ttc:0,items:[]};const tva=Math.round(f.montant_ht*0.2);const ttc=f.montant_ht+tva;tvaCollMap[mk].ht+=f.montant_ht;tvaCollMap[mk].tva+=tva;tvaCollMap[mk].ttc+=ttc;tvaCollMap[mk].items.push({label:`Fact. ONE CO ${f.numero}${f.libelle?' - '+f.libelle:''}`,ht:f.montant_ht,tva,ttc,id:f.id});});const tvaDedMap={};D.createurs.filter(cr=>cr.tva&&cr.statut==='paye'&&cr.date_paiement_reel).forEach(cr=>{const mk=moisKey(cr.date_paiement_reel);if(!tvaDedMap[mk])tvaDedMap[mk]={ht:0,tva:0,ttc:0,items:[]};const ht=crHT(cr),ttc=crTTC(cr),tva=ttc-ht;tvaDedMap[mk].ht+=ht;tvaDedMap[mk].tva+=tva;tvaDedMap[mk].ttc+=ttc;const c=getCamp(cr.campagne_id);tvaDedMap[mk].items.push({label:`${cr.emetteur||cr.nom||'--'} - ${c.nom||'--'}`,ht,tva,ttc});});D.retrocessions_paiements.filter(p=>p.montant_ht&&p.date).forEach(p=>{const mk=moisKey(p.date);if(!tvaDedMap[mk])tvaDedMap[mk]={ht:0,tva:0,ttc:0,items:[]};const tva=Math.round(p.montant_ht*0.2);const ttc=p.montant_ht+tva;tvaDedMap[mk].ht+=p.montant_ht;tvaDedMap[mk].tva+=tva;tvaDedMap[mk].ttc+=ttc;tvaDedMap[mk].items.push({label:`Retro : ${p.description}`,ht:p.montant_ht,tva,ttc});});D.frais.filter(f=>f.paye&&f.date).forEach(f=>{const mk=moisKey(f.date);if(!tvaDedMap[mk])tvaDedMap[mk]={ht:0,tva:0,ttc:0,items:[]};const tva=Math.round(f.montant_ht*0.2);const ttc=f.montant_ht+tva;tvaDedMap[mk].ht+=f.montant_ht;tvaDedMap[mk].tva+=tva;tvaDedMap[mk].ttc+=ttc;const c=getCamp(f.campagne_id);tvaDedMap[mk].items.push({label:`Frais : ${f.libelle} (${c.nom||'--'})`,ht:f.montant_ht,tva,ttc});});const TVA_CUTOFF='2026-04';const allMoisFull=[...new Set([...Object.keys(tvaCollMap),...Object.keys(tvaDedMap)])].sort();const allMois=allMoisFull.filter(m=>m>=TVA_CUTOFF);const totColl=allMois.reduce((s,mk)=>s+(tvaCollMap[mk]?tvaCollMap[mk].tva:0),0);const totDed=allMois.reduce((s,mk)=>s+(tvaDedMap[mk]?tvaDedMap[mk].tva:0),0);const solde=totColl-totDed;const totalOnecoHT=D.factures_oneco.reduce((s,f)=>s+f.montant_ht,0);const totalOnecoEnc=D.factures_oneco.filter(f=>f.statut==='paye').reduce((s,f)=>s+f.montant_ht,0);const totalOnecoAtt=D.factures_oneco.filter(f=>f.statut!=='paye').reduce((s,f)=>s+f.montant_ht,0);el.innerHTML=`<div class="section-header"><h2 style="margin:0">ONE CO MEDIA - TVA</h2><button class="btn btn-primary" onclick="openModalOneco()">+ Facture ONE CO → Androma</button></div><div class="alert alert-info" style="margin-bottom:1.25rem"><strong>Circuit :</strong> ANDROMA INVESTISSEMENT encaisse les clients → refacture ONE CO MEDIA → ONE CO paie les createurs et frais.<br>La TVA collectee de ONE CO est celle de ses factures a ANDROMA. La TVA deductible provient des createurs assujettis, frais et retrocessions payes.</div><div class="sl">Factures ONE CO → Androma Investissement</div><div class="card" style="margin-bottom:.75rem"><div style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1rem"><div><div class="metric-label" style="font-size:10px">Total HT emis</div><div style="font-size:18px;font-weight:700">${fmt(totalOnecoHT)}</div></div><div><div class="metric-label" style="font-size:10px">Encaisse HT</div><div style="font-size:18px;font-weight:700;color:var(--success)">${fmt(totalOnecoEnc)}</div></div><div><div class="metric-label" style="font-size:10px">En attente HT</div><div style="font-size:18px;font-weight:700;color:var(--warning)">${fmt(totalOnecoAtt)}</div></div></div>${D.factures_oneco.length===0?`<div class="empty" style="padding:1rem">Aucune facture ONE CO</div>`:`<div class="table-wrap"><table><thead><tr><th style="width:12%">N</th><th style="width:30%">Libelle / campagnes</th><th style="width:14%">HT</th><th style="width:14%">TVA 20%</th><th style="width:14%">TTC</th><th style="width:10%">Statut</th><th style="width:6%"></th></tr></thead><tbody>${[...D.factures_oneco].sort((a,b)=>(b.date||'')>(a.date||'')?1:-1).map(f=>{const tva=Math.round(f.montant_ht*0.2);return`<tr class="${f.statut==='paye'?'row-paye':''}"><td style="font-weight:600;font-size:13px">${f.numero}</td><td style="font-size:12px">${f.libelle||'--'}<div style="font-size:11px;color:var(--text2)">${fmtD(f.date)}</div></td><td style="font-weight:600">${fmt(f.montant_ht)}</td><td style="color:var(--warning);font-weight:600">${fmt(tva)}</td><td style="font-weight:600">${fmt(f.montant_ht+tva)}</td><td><select onchange="setStatutOneco('${f.id}',this.value)" style="font-size:11px;padding:3px 6px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:var(--font);cursor:pointer"><option value="attente" ${f.statut==='attente'?'selected':''}>En attente</option><option value="paye" ${f.statut==='paye'?'selected':''}>Encaisse</option></select></td><td><button class="btn btn-sm btn-danger" onclick="delOneco('${f.id}')">&#x2715;</button></td></tr>`;}).join('')}</tbody></table></div>`}</div><hr class="divider" style="margin:1.5rem 0"><div class="section-header" style="margin-bottom:1rem"><h3 style="margin:0;font-size:15px;font-weight:600">Position TVA ONE CO MEDIA</h3></div><div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-bottom:1.75rem"><div class="metric"><div class="metric-label">TVA collectee (sur factures encaissees)</div><div class="metric-value warn">${fmt(totColl)}</div></div><div class="metric"><div class="metric-label">TVA deductible (charges payees)</div><div class="metric-value neg">${fmt(totDed)}</div></div><div class="metric"><div class="metric-label">Solde TVA net</div><div class="metric-value ${solde>=0?'neg':'pos'}">${fmt(solde)}</div><div class="metric-sub">${solde>=0?'a reverser au Tresor':'credit de TVA'}</div></div></div><div class="sl">Balance TVA mois par mois</div>${allMois.length===0?`<div class="card"><div class="empty">Aucune donnee - les donnees apparaissent quand les factures ONE CO et les charges sont marquees payees.</div></div>`:allMois.map(mk=>{const coll=tvaCollMap[mk]||{ht:0,tva:0,ttc:0,items:[]};const ded=tvaDedMap[mk]||{ht:0,tva:0,ttc:0,items:[]};const soldeMois=coll.tva-ded.tva;return`<div class="card" style="margin-bottom:1rem"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.875rem"><div style="font-size:14px;font-weight:700">${moisLabel(mk)}</div><div style="display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:var(--text2)">Collectee : <strong style="color:var(--warning)">${fmt(coll.tva)}</strong></span><span style="font-size:12px;color:var(--text2)">Deductible : <strong style="color:var(--success)">${fmt(ded.tva)}</strong></span><span style="font-size:13px;font-weight:700;padding:4px 10px;border-radius:var(--r);background:${soldeMois>=0?'var(--danger-bg)':'var(--success-bg)'};color:${soldeMois>=0?'var(--danger)':'var(--success)'}">${soldeMois>=0?'A reverser':'Credit'} : ${fmt(Math.abs(soldeMois))}</span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem"><div><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--warning);margin-bottom:.5rem">TVA collectee - factures ONE CO encaissees</div>${coll.items.length===0?`<div style="font-size:12px;color:var(--text3);padding:.5rem 0">Aucune facture ONE CO encaissee ce mois</div>`:`<table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:4px 6px;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)">Facture ONE CO</th><th style="text-align:right;padding:4px 6px;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)">HT</th><th style="text-align:right;padding:4px 6px;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)">TVA</th><th style="text-align:right;padding:4px 6px;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)">TTC</th></tr></thead><tbody>${coll.items.map(i=>`<tr><td style="padding:4px 6px;border-bottom:.5px solid var(--border)">${i.label}</td><td style="text-align:right;padding:4px 6px;border-bottom:.5px solid var(--border)">${fmt(i.ht)}</td><td style="text-align:right;padding:4px 6px;border-bottom:.5px solid var(--border);color:var(--warning);font-weight:600">${fmt(i.tva)}</td><td style="text-align:right;padding:4px 6px;border-bottom:.5px solid var(--border)">${fmt(i.ttc)}</td></tr>`).join('')}</tbody><tfoot><tr><td style="padding:5px 6px;font-weight:600">Total</td><td style="text-align:right;padding:5px 6px;font-weight:600">${fmt(coll.ht)}</td><td style="text-align:right;padding:5px 6px;font-weight:700;color:var(--warning)">${fmt(coll.tva)}</td><td style="text-align:right;padding:5px 6px;font-weight:600">${fmt(coll.ttc)}</td></tr></tfoot></table>`}</div><div><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--success);margin-bottom:.5rem">TVA deductible - charges ONE CO payees</div>${ded.items.length===0?`<div style="font-size:12px;color:var(--text3);padding:.5rem 0">Aucune charge payee avec TVA ce mois</div>`:`<table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:4px 6px;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)">Charge</th><th style="text-align:right;padding:4px 6px;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)">HT</th><th style="text-align:right;padding:4px 6px;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)">TVA</th><th style="text-align:right;padding:4px 6px;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)">TTC</th></tr></thead><tbody>${ded.items.map(i=>`<tr><td style="padding:4px 6px;border-bottom:.5px solid var(--border)">${i.label}</td><td style="text-align:right;padding:4px 6px;border-bottom:.5px solid var(--border)">${fmt(i.ht)}</td><td style="text-align:right;padding:4px 6px;border-bottom:.5px solid var(--border);color:var(--success);font-weight:600">${fmt(i.tva)}</td><td style="text-align:right;padding:4px 6px;border-bottom:.5px solid var(--border)">${fmt(i.ttc)}</td></tr>`).join('')}</tbody><tfoot><tr><td style="padding:5px 6px;font-weight:600">Total</td><td style="text-align:right;padding:5px 6px;font-weight:600">${fmt(ded.ht)}</td><td style="text-align:right;padding:5px 6px;font-weight:700;color:var(--success)">${fmt(ded.tva)}</td><td style="text-align:right;padding:5px 6px;font-weight:600">${fmt(ded.ttc)}</td></tr></tfoot></table>`}</div></div></div>`;}).join('')}`;}
function openModalOneco(){const nextNum=String((D.factures_oneco||[]).length+1).padStart(3,'0');const num=`ONECO-${new Date().getFullYear()}-${nextNum}`;document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModalIfBg(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-title"><span>Nouvelle facture ONE CO → Androma</span><button class="btn btn-sm" onclick="closeModal()">&#x2715;</button></div><div class="alert alert-info" style="margin-bottom:1rem;font-size:12px">Facture emise par ONE CO MEDIA a destination d'ANDROMA INVESTISSEMENT. Taux TVA : 20% calcule automatiquement.</div><div class="form-row"><div class="field"><label>N de facture *</label><input id="oc-num" value="${num}"></div><div class="field"><label>Date d'emission *</label><input id="oc-date" type="date" value="${today()}"></div></div><div class="form-row single"><div class="field"><label>Libelle / campagnes concernees</label><input id="oc-lib" placeholder="ex : Campagnes Q1 2026 - Sephora + Nike"></div></div><div class="form-row"><div class="field"><label>Montant HT (euros) *</label><input id="oc-ht" type="number" placeholder="ex : 45000"></div><div class="field"><label>TVA 20% - calculee</label><input id="oc-tva" type="number" readonly style="opacity:.7"></div></div><div class="form-row"><div class="field"><label>Montant TTC</label><input id="oc-ttc" type="number" readonly style="opacity:.7"></div><div class="field"><label>Date d'encaissement par ONE CO</label><input id="oc-paie" type="date"></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:1rem"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveOneco()">Enregistrer</button></div></div></div>`;const calc=()=>{const h=parseFloat(document.getElementById('oc-ht').value)||0;const tva=Math.round(h*0.2);document.getElementById('oc-tva').value=tva;document.getElementById('oc-ttc').value=h+tva;};document.getElementById('oc-ht').addEventListener('input',calc);}

ng></span></div></div><div class="progress-bar"><div class="progress-fill" style="width:${rv.provisionne>0?Math.min(100,Math.round(rv.utilise/rv.provisionne*100)):0}%;background:var(--warning-bd)"></div></div><div style="margin-top:.5rem;font-size:11px;color:var(--text3)">Gerer dans l'onglet Retrocessions</div></div><div style="background:var(--warning-bg);border-left:4px solid var(--warning-bd);border-radius:var(--r);padding:.5rem 1rem;margin-bottom:8px"><span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--warning)">Operations par mois</span></div>${Object.keys(byMois).sort().map(mk=>{const camps=byMois[mk];const totMarge=camps.reduce((s,c)=>{const m=calcMarge(c.id);return s+m.marge;},0);const totCA=camps.reduce((s,c)=>{const m=calcMarge(c.id);return s+(m.ca_ht||c.budget_ht);},0);const pctG=totCA?Math.round(totMarge/totCA*100):0;const colG=pctG>=20?'var(--success)':pctG>=10?'var(--warning)':'var(--danger)';return`<div style="margin-bottom:2rem"><div style="background:var(--bg2);border-radius:var(--r);padding:10px 20px;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:16px"><div style="display:flex;align-items:baseline;gap:10px"><div style="font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.4px;line-height:1">${moisLabel(mk).split(' ')[0]}</div><div style="font-size:13px;font-weight:500;color:var(--text2)">${moisLabel(mk).split(' ')[1]||''}</div></div><div style="font-size:14px;font-weight:600;color:${colG}">${fmt(totMarge)} <span style="font-size:12px;font-weight:400;color:var(--text2)">(${pctG}%)</span></div></div>${camps.map(c=>{const m=calcMarge(c.id);const pct=m.ca_ht?Math.round(m.marge/m.ca_ht*100):0;const col=pct>=20?'var(--success)':pct>=10?'var(--warning)':'var(--danger)';const cc=campColor(c.id);const rfc=getRealFC(c.id);const poWarn=hasPOWarn(c.id);return`<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.875rem ],['Retrocession provisionnee',rv.provisionne],['Retrocession utilisee',rv.utilise],['Retrocession restante',rv.restant]]);XLSX.utils.book_append_sheet(wb,wsTb,'Synthese');XLSX.writeFile(wb,`campagnes_${today()}.xlsx`);}
