<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campagnes d'influence</title>
<style>
/* ── DESIGN TOKENS ─────────────────────────────────────────────── */
:root{
  /* Backgrounds */
  --bg:#ffffff;
  --bg2:#f5f4f1;
  --bg3:#eeecea;
  --bg4:#e7e5e2;
  /* Text */
  --text:#111110;
  --text2:#636058;
  --text3:#a09d97;
  /* Borders */
  --border:rgba(0,0,0,.07);
  --border2:rgba(0,0,0,.15);
  /* Semantic — conserve ton code couleur métier */
  --success:#1a6b35;--success-bg:#e8f5ec;--success-bd:#3aaa60;
  --warning:#7a4500;--warning-bg:#fff4e0;--warning-bd:#e09000;
  --danger:#8b1a1a;--danger-bg:#fff0f0;--danger-bd:#d93025;
  --info:#0a4f8c;--info-bg:#e8f2fd;--info-bd:#3b82f6;
  /* Layout */
  --sidebar:224px;
  --r:8px;--rl:12px;--rxl:16px;
  /* Typography */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  --mono:"SF Mono","Fira Code",Consolas,monospace;
  /* Shadows — subtiles */
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 4px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--bg2:#222220;--bg3:#2a2a27;--bg4:#323230;
  --text:#e8e6df;--text2:#9a9891;--text3:#636158;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --success:#6fcf97;--success-bg:#0d2e1a;--success-bd:#27ae60;
  --warning:#f6c567;--warning-bg:#2d1800;--warning-bd:#e09000;
  --danger:#f08080;--danger-bg:#2e0d0d;--danger-bd:#d93025;
  --info:#7bb8f5;--info-bg:#061e38;--info-bd:#3b82f6;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  --shadow-md:0 2px 8px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.4);
}}

/* ── RESET ──────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg3);line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── LAYOUT PRINCIPAL ───────────────────────────────────────────── */
.app-layout{display:flex;min-height:100vh}

/* ── SIDEBAR ────────────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--bg);
  border-right:1px solid var(--border);
  position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  z-index:60;
  overflow:hidden;
}
.sidebar-logo{
  padding:24px 16px 16px;
  border-bottom:1px solid var(--border);
}
.sidebar-logo-title{
  font-family:var(--font-display);
  font-size:15px;font-weight:700;
  letter-spacing:-.3px;color:var(--text);
  line-height:1.2;
}
.sidebar-logo-sub{font-size:11px;color:var(--text3);margin-top:3px}

.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar-section{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--text3);
  padding:16px 16px 4px;
}
.sidebar-btn{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:8px 16px;
  border:none;background:transparent;
  font-size:13px;font-weight:500;color:var(--text2);
  font-family:var(--font);cursor:pointer;
  border-radius:0;transition:all .12s;
  text-align:left;line-height:1.4;
  position:relative;
}
.sidebar-btn:hover{background:var(--bg2);color:var(--text)}
.sidebar-btn.active{
  background:var(--bg2);color:var(--text);font-weight:600;
}
.sidebar-btn.active::before{
  content:'';position:absolute;left:0;top:4px;bottom:4px;
  width:3px;background:var(--info-bd);border-radius:0 2px 2px 0;
}
.sidebar-btn .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{
  padding:12px 16px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;
}
.sidebar-sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--success-bd)}
.sync-dot.saving{background:var(--warning-bd)}
.sync-dot.err{background:var(--danger-bd)}
.sync-dot.off{background:var(--text3)}

/* ── MAIN CONTENT ────────────────────────────────────────────────── */
.main-content{
  margin-left:var(--sidebar);
  flex:1;min-width:0;
  display:flex;flex-direction:column;
}
.wrap{max-width:1040px;margin:0 auto;padding:32px 24px}

/* ── PAGE & NAV (keep for JS compatibility) ─────────────────────── */
.page{display:none}.page.active{display:block}
/* Legacy nav hidden — sidebar replaces it */
.nav,.topbar{display:none}

/* ── CARDS ──────────────────────────────────────────────────────── */
.card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--rl);padding:16px 24px;
  margin-bottom:16px;box-shadow:var(--shadow);
  transition:box-shadow .15s;
}
.card:hover{box-shadow:var(--shadow-md)}

/* ── METRICS ────────────────────────────────────────────────────── */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:12px;margin-bottom:24px}
.metric{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--rl);padding:16px;box-shadow:var(--shadow);
}
.metric-label{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--text3);margin-bottom:8px;
}
.metric-value{
  font-family:var(--font-display);
  font-size:24px;font-weight:600;color:var(--text);
  letter-spacing:-.5px;line-height:1;
}
.metric-sub{font-size:11px;color:var(--text3);margin-top:6px}
.pos{color:var(--success)!important}
.neg{color:var(--danger)!important}
.warn{color:var(--warning)!important}

/* ── SECTION HEADERS ─────────────────────────────────────────────── */
h2{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.4px;margin-bottom:24px;color:var(--text)}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px;padding-left:2px}

/* ── BADGES ─────────────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;
}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-en-cours{background:var(--info-bg);color:var(--info-bd)}.badge-en-cours::before{background:var(--info-bd)}
.badge-termine{background:var(--success-bg);color:var(--success)}.badge-termine::before{background:var(--success-bd)}
.badge-en-attente{background:var(--warning-bg);color:var(--warning)}.badge-en-attente::before{background:var(--warning-bd)}
.badge-annule{background:var(--bg2);color:var(--text3)}.badge-annule::before{background:var(--text3)}
.badge-paye{background:var(--success-bg);color:var(--success)}.badge-paye::before{background:var(--success-bd)}
.badge-attente{background:var(--warning-bg);color:var(--warning)}.badge-attente::before{background:var(--warning-bd)}
.badge-retard{background:var(--danger-bg);color:var(--danger)}.badge-retard::before{background:var(--danger-bd)}

/* ── BUTTONS ─────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--r);
  border:1px solid var(--border2);background:var(--bg);
  color:var(--text);cursor:pointer;font-size:13px;font-weight:500;
  font-family:var(--font);transition:all .12s;line-height:1;
  white-space:nowrap;
}
.btn:hover{background:var(--bg2);border-color:var(--text)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{opacity:.85;background:var(--text)}
.btn-danger{color:var(--danger);border-color:var(--danger-bd)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-success{color:var(--success);border-color:var(--success-bd);background:var(--success-bg)}
.btn-success:hover{opacity:.87}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px 8px;border-radius:var(--r)}

/* ── FORMS ──────────────────────────────────────────────────────── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-row.single{grid-template-columns:1fr}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px;position:relative}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2)}
.field input,.field select{
  font-size:13px;padding:9px 12px;
  border:1px solid var(--border2);border-radius:var(--r);
  background:var(--bg);color:var(--text);width:100%;
  font-family:var(--font);transition:border-color .12s,box-shadow .12s;
}
.field input:focus,.field select:focus{
  outline:none;border-color:var(--info-bd);
  box-shadow:0 0 0 3px rgba(59,130,246,.1);
}
.field input::placeholder{color:var(--text3)}
.hint{font-size:11px;color:var(--text3);margin-top:4px}

/* ── AUTOCOMPLETE ────────────────────────────────────────────────── */
.ac-list{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:var(--bg);border:1px solid var(--border2);
  border-radius:var(--r);box-shadow:var(--shadow-lg);
  z-index:200;max-height:200px;overflow-y:auto;
}
.ac-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:.5px solid var(--border)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.selected{background:var(--bg2)}
.ac-item mark{background:transparent;color:var(--text);font-weight:700}

/* ── TABLES ──────────────────────────────────────────────────────── */
.table-wrap{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
thead{background:var(--bg2)}
th{
  text-align:left;font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:.5px;
  color:var(--text3);padding:8px 12px;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
td{
  padding:11px 12px;border-bottom:.5px solid var(--border);
  vertical-align:middle;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;color:var(--text);
}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.td-main{font-weight:500}
.td-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* ── CHIPS & FILTERS ─────────────────────────────────────────────── */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  font-size:12px;padding:5px 12px;border-radius:20px;
  border:1px solid var(--border2);background:var(--bg);
  color:var(--text2);cursor:pointer;transition:all .12s;font-weight:500;
}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.chip:hover:not(.active){border-color:var(--text);color:var(--text)}

/* ── MODALS ──────────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:100;overflow-y:auto;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal{
  background:var(--bg);border-radius:var(--rxl);
  border:1px solid var(--border);
  padding:24px;width:100%;max-width:660px;margin:auto;
  box-shadow:var(--shadow-lg);
}
.modal-title{
  font-size:16px;font-weight:600;margin-bottom:20px;
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:16px;border-bottom:1px solid var(--border);
  letter-spacing:-.2px;
}
.modal-section{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--text3);
  margin:20px 0 12px;padding-top:20px;border-top:1px solid var(--border);
}

/* ── STATUS TOGGLE ───────────────────────────────────────────────── */
.stog{display:inline-flex;border-radius:var(--r);overflow:hidden;border:1px solid var(--border2)}
.stog button{
  padding:5px 10px;border:none;border-right:1px solid var(--border2);
  background:var(--bg);cursor:pointer;color:var(--text2);
  transition:all .12s;white-space:nowrap;font-family:var(--font);
  font-size:12px;font-weight:500;line-height:1.4;
}
.stog button:last-child{border-right:none}
.stog button:hover:not(.is-active){background:var(--bg2);color:var(--text)}
.stog button.is-active.c-attente{background:var(--warning-bg);color:var(--warning);font-weight:700}
.stog button.is-active.c-retard{background:var(--danger-bg);color:var(--danger);font-weight:700}
.stog button.is-active.c-paye{background:var(--success-bg);color:var(--success);font-weight:700}

/* ── MISC ────────────────────────────────────────────────────────── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 16px;color:var(--text3);gap:16px;text-align:center}
.empty-state-icon{width:48px;height:48px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text2);border:1px solid var(--border)}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:32px}
.progress-bar{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .4s ease}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.sub-section{margin-top:24px;padding-top:24px;border-top:1px solid var(--border)}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg2);color:var(--text2);border:.5px solid var(--border2);font-weight:500}
.alert{padding:12px 16px;border-radius:var(--r);font-size:13px;margin-bottom:16px;line-height:1.6}
.alert-danger{background:var(--danger-bg);color:var(--danger);border-left:3px solid var(--danger-bd)}
.alert-warning{background:var(--warning-bg);color:var(--warning);border-left:3px solid var(--warning-bd)}
.alert-info{background:var(--info-bg);color:var(--info-bd);border-left:3px solid var(--info-bd)}
.date-il{font-size:12px;padding:5px 9px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);width:116px;font-family:var(--mono)}
.date-il:focus{outline:none;border-color:var(--info-bd)}
.date-il::placeholder{color:var(--text3);font-family:var(--font)}
.row-paye td{opacity:.5}
.pb{margin-bottom:24px}
.pb-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:8px}
.actions-cell{display:flex;gap:4px;align-items:center}
.amount-pos{color:var(--success);font-weight:600}
.amount-neg{color:var(--danger);font-weight:600}
.retro-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--warning-bg);color:var(--warning);border:.5px solid var(--warning-bd);font-weight:600}
.month-band{background:var(--info-bg);border-left:4px solid var(--info-bd);border-radius:var(--r);padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.month-band-title{font-size:14px;font-weight:700;color:var(--info-bd)}
.month-band-right{font-size:13px;font-weight:600;color:var(--danger)}
</style>
</head>
<body>
<div class="app-layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-title">ONE CO MEDIA</div>
      <div class="sidebar-logo-sub" id="hdr-sub">Chargement...</div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section">Opérations</div>
      <button class="sidebar-btn active" onclick="showPage('campagnes')">
        <span class="icon">📋</span>Campagnes
      </button>
      <button class="sidebar-btn" onclick="showPage('createurs')">
        <span class="icon">👤</span>Créateurs
      </button>

      <div class="sidebar-section">Finance</div>

        <span class="icon">💳</span>Paiements
      </button>

        <span class="icon">🔄</span>Rétrocessions
      </button>
      <button class="sidebar-btn" onclick="showPage('oneco')">
        <span class="icon">🧾</span>ONE CO &amp; TVA
      </button>

      <div class="sidebar-section">Contrats</div>
      <button class="sidebar-btn" onclick="showPage('contrats')">
        <span class="icon">📝</span>Contrats
      </button>

      <div class="sidebar-section">Synthèse</div>
      <button class="sidebar-btn" onclick="showPage('dashboard')">
        <span class="icon">📊</span>Tableau de bord
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-sync">
        <span class="sync-dot off" id="sync-dot"></span>
        <span id="sync-status">Non connecté</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <button class="btn btn-sm" style="flex:1;justify-content:center" onclick="openSyncSettings()">☁ Sync</button>
        <button class="btn btn-sm btn-success" style="flex:1;justify-content:center" onclick="exportExcel()">↓ Excel</button>
      </div>
      <button class="btn btn-sm" style="width:100%;justify-content:center;background:var(--info-bg);color:var(--info-bd);border-color:var(--info-bd)" onclick="backupJSON()">💾 Backup JSON</button>
    </div>
  </aside>

  <!-- ── MAIN CONTENT ── -->
  <main class="main-content">
    <!-- Legacy nav (hidden, kept for JS compat) -->
    <nav class="nav">
      <button class="active" onclick="showPage('campagnes')">Campagnes</button>
      <button onclick="showPage('createurs')">Créateurs</button>
      <button onclick="showPage('paiements')">Paiements</button>
      <button onclick="showPage('retrocessions')">Rétrocessions</button>
      <button onclick="showPage('oneco')">ONE CO &amp; TVA</button>
      <button onclick="showPage('dashboard')">Tableau de bord</button>
    </nav>
    <div class="wrap">
      <div id="page-campagnes" class="page active"></div>
      <div id="page-createurs" class="page"></div>
      <div id="page-paiements" class="page"></div>
      <div id="page-retrocessions" class="page"></div>
      <div id="page-oneco" class="page"></div>
      <div id="page-contrats" class="page"></div>
      <div id="page-dashboard" class="page"></div>
    </div>
  </main>
</div>
<div id="modal-container"></div>

<script>
// ─── STORAGE & SYNC ───────────────────────────────────────────────
const SK='influence_prod_v1';
/* ── RESTAURATION DONNÉES 27/04/2026 ──
   Ces données seront chargées UNE SEULE FOIS dans le localStorage,
   puis écrasées/complétées par la sync JSONbin si plus récente */
(function(){

async function pushToCloud(){
  if(!syncCfg.apiKey||!syncCfg.binId)return;
  setSyncStatus('saving','Sauvegarde...');
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${syncCfg.binId}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':syncCfg.apiKey,'X-Bin-Versioning':'false'},body:JSON.stringify(D)});
    if(r.ok){setSyncStatus('ok','Synchronisé — '+(new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));}
    else{setSyncStatus('err','Erreur sync ('+r.status+')');}
  }catch(e){setSyncStatus('err','Erreur réseau');}
}

/* Récupère les données cloud SANS écraser si les données locales sont plus récentes */
async function pullFromCloud(forceOverwrite=false){
  if(!syncCfg.apiKey||!syncCfg.binId)return false;
  setSyncStatus('saving','Vérification...');
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${syncCfg.binId}/latest`,{headers:{'X-Master-Key':syncCfg.apiKey}});
    if(r.ok){
      const j=await r.json();
      const cloudData=j.record;
      const cloudTs=cloudData._lastModified||0;
      const localTs=D._lastModified||0;
      if(!forceOverwrite && localTs>cloudTs){
        /* Données locales plus récentes → on garde le local et on pousse vers le cloud */
        setSyncStatus('ok','Local plus récent — envoi cloud...');
        await pushToCloud();
        return true;
      }
      /* Cloud plus récent (ou force) → on charge le cloud */
      D=cloudData;
      migrateD();
      saveLocalSilent(); /* ne pas écraser le timestamp cloud */
      setSyncStatus('ok','Synchronisé — '+(new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));
      return true;
    }
    else{setSyncStatus('err','Erreur sync ('+r.status+')');return false;}
  }catch(e){setSyncStatus('err','Erreur réseau');return false;}
}

/* Polling auto toutes les 30s : ne charge le cloud que s'il est plus récent */
async function startSyncPolling(){
  if(window._syncPoll)clearInterval(window._syncPoll);
  if(!syncCfg.apiKey||!syncCfg.binId)return;
  window._syncPoll=setInterval(async()=>{
    if(!syncCfg.apiKey||!syncCfg.binId)return;
    setSyncStatus('saving','Vérification...');
    try{
      const r=await fetch(`https://api.jsonbin.io/v3/b/${syncCfg.binId}/latest`,{headers:{'X-Master-Key':syncCfg.apiKey}});
      if(!r.ok)return;
      const j=await r.json();
      const cloudData=j.record;
      const cloudTs=cloudData._lastModified||0;
      const localTs=D._lastModified||0;
      if(cloudTs>localTs){
        /* Quelqu'un d'autre a modifié → on charge */
        D=cloudData;
        migrateD();
        saveLocalSilent(); /* ne pas écraser le timestamp cloud */
        updateHeader();
        const activePage=document.querySelector('.sidebar-btn.active')||document.querySelector('.nav button.active');
        if(activePage){const pn=activePage.getAttribute('onclick').match(/'([^']+)'/)?.[1];if(pn)({campagnes:renderCampagnes,createurs:renderCreateurs,paiements:renderPaiements,retrocessions:renderRetrocessions,oneco:renderOneco,dashboard:renderDashboard})[pn]?.();}
        setSyncStatus('ok','Mis à jour — '+(new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));
      } else {
        setSyncStatus('ok','Synchronisé — '+(new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));
      }
    }catch(e){setSyncStatus('err','Erreur réseau');}
  },30000);
}

async function createBin(){
  if(!syncCfg.apiKey)return null;
  try{
    const r=await fetch('https://api.jsonbin.io/v3/b',{method:'POST',headers:{'Content-Type':'application/json','X-Master-Key':syncCfg.apiKey,'X-Bin-Name':'influence-campagnes'},body:JSON.stringify(D)});
    if(r.ok){const j=await r.json();return j.metadata.id;}
    return null;
  }catch(e){return null;}
}

async function initSync(){
  loadSyncCfg();
  /* Charger le local EN PREMIER et afficher immédiatement */
  loadLocal();
  updateHeader();
  renderCampagnes();
  /* Backup automatique quotidien */
  autoBackupIfNeeded();
  /* Sync cloud en arrière-plan APRÈS l'affichage */
  setTimeout(async()=>{
    await pullFromCloudOnStart();
    updateHeader();
    refreshCurrentPage();
    startSyncPolling();
  }, 500);
}

async function pullFromCloudOnStart(){
  if(!syncCfg.apiKey||!syncCfg.binId)return;
  setSyncStatus('saving','Connexion...');
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${syncCfg.binId}/latest`,
      {headers:{'X-Master-Key':syncCfg.apiKey}});
    if(!r.ok){setSyncStatus('err','Erreur sync ('+r.status+')');return;}
    const j=await r.json();
    const cloudData=j.record;
    const cloudTs=cloudData._lastModified||0;
    const localTs=D._lastModified||0;
    if(cloudTs>localTs){
      /* Cloud strictement plus récent → prendre le cloud */
      D=cloudData;migrateD();saveLocalSilent();
      setSyncStatus('ok','Synchronisé — '+(new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})));
    } else {
      /* Local plus récent (modif < quelques secondes avant fermeture) → pousser vers cloud */
      setSyncStatus('saving','Envoi données locales...');
      await pushToCloud();
    }
  }catch(e){setSyncStatus('err','Erreur réseau');}
}

// ─── UTILS ───────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function today(){return new Date().toISOString().split('T')[0];}
function fmt(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);}
function fmtD(d){if(!d)return'—';const[y,m,j]=d.split('-');return`${j}/${m}/${y}`;}
function addDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];}
function isOverdue(ech,paid){return!paid&&ech&&ech<today();}
/* Montants HT et TTC d'un créateur (TTC=HT si micro-entrepreneur sans TVA) */
function crHT(cr){return cr.montant_ht||0;}

/* Détecte si une facture est fictive (numéro = "FC" seul, sans suite) */
function isFakeFC(f){
  return !f.numero || f.numero.trim().toUpperCase()==='FC';
}

/* Retourne les vraies factures (non fictives) d'une campagne */
function getRealFC(cid){
  return getFcByCamp(cid).filter(f=>!isFakeFC(f));
}

/* Code couleur campagne selon état facture client
   Returns: { bar, badge_bg, badge_text, label, warn }
   bar       = couleur bordure gauche de carte (3px)
   badge_bg  = fond du badge nom (très pâle)
   badge_text= couleur texte badge
   label     = libellé état
   warn      = null | 'retard'
*/
function campColor(cid){
  const realFc=getRealFC(cid);
  if(!realFc.length)return{
    bar:'#3b82f6',badge_bg:'#eff6ff',badge_text:'#1d4ed8',
    label:'À facturer',warn:null
  };
  const retard=realFc.some(f=>f.statut==='retard');
  const paye=realFc.every(f=>f.statut==='paye');
  if(paye)return{
    bar:'#22c55e',badge_bg:'#f0fdf4',badge_text:'#15803d',
    label:'Payée',warn:null
  };
  if(retard)return{
    bar:'#ef4444',badge_bg:'#fff1f2',badge_text:'#b91c1c',
    label:'Retard',warn:'retard'
  };
  return{
    bar:'#f97316',badge_bg:'#fff7ed',badge_text:'#c2410c',
    label:'En attente',warn:null
  };
}

/* PO warning : seulement sur les vraies factures */
function hasPOWarn(cid){
  const realFc=getRealFC(cid);
  return realFc.length>0&&realFc.some(f=>!f.po);
}

/* fmt HT + TTC pair */
function fmtHTTTC(ht,ttc){return `<span style="font-weight:600">${fmt(ht)}</span> <span style="font-size:11px;color:var(--text2)">· ${fmt(ttc)} TTC</span>`;}
function fmtFrHTTTC(fr){const tva=fr.tva_frais||0;const ttc=Math.round(fr.montant_ht*(1+tva/100));return fmtHTTTC(fr.montant_ht,ttc);}
function crTTC(cr){return cr.tva?(Math.round((cr.montant_ht||0)*1.2)):(cr.montant_ht||0);}
function fmtCrHT(cr){return fmt(crHT(cr));}
function fmtCrTTC(cr){if(cr.tva)return fmt(crTTC(cr));return fmt(crHT(cr))+' <span style="font-size:10px;color:var(--text3)">= TTC</span>';}
function getCamp(id){return D.campagnes.find(c=>c.id===id)||{};}
function getCrByCamp(cid){return D.createurs.filter(c=>c.campagne_id===cid);}
function getFrByCamp(cid){return D.frais.filter(f=>f.campagne_id===cid);}
function getFcByCamp(cid){return D.factures_clients.filter(f=>f.campagne_id===cid);}

// ─── AUTOCOMPLETE ─────────────────────────────────────────────────
function getACData(field){
  const set=new Set();
  D.createurs.forEach(c=>{
    if(field==='emetteur'&&c.emetteur)set.add(c.emetteur);
    if(field==='createur'&&c.createur)set.add(c.createur);
    if(field==='iban'&&c.iban)set.add(c.iban);
    if(field==='bic'&&c.bic)set.add(c.bic);
  });
  return [...set];
}

/* Retourne {iban, bic} pour un émetteur ou créateur donné (premier match) */
function getBankForName(val, field){
  const lv=val.toLowerCase();
  const match=D.createurs.find(c=>{
    const name=(field==='emetteur'?c.emetteur:c.createur)||'';
    return name.toLowerCase()===lv && (c.iban||c.bic);
  });
  return match?{iban:match.iban||'',bic:match.bic||''}:null;
}

function fillBankFields(val, field){
  const bank=getBankForName(val, field);
  if(!bank)return;
  const ibanEl=document.getElementById('cr-iban');
  const bicEl=document.getElementById('cr-bic');
  if(ibanEl&&!ibanEl.value&&bank.iban)ibanEl.value=bank.iban;
  if(bicEl&&!bicEl.value&&bank.bic)bicEl.value=bank.bic;
}

function setupAC(inputId,field){
  const inp=document.getElementById(inputId);
  if(!inp)return;
  let idx=-1;
  function show(val){
    const existing=document.getElementById('ac-'+inputId);
    if(existing)existing.remove();
    if(!val)return;
    const items=getACData(field).filter(x=>x.toLowerCase().startsWith(val.toLowerCase())&&x.toLowerCase()!==val.toLowerCase());
    if(!items.length)return;
    const list=document.createElement('div');
    list.id='ac-'+inputId;list.className='ac-list';
    items.forEach((it,i)=>{
      const d=document.createElement('div');
      d.className='ac-item';
      /* Affiche IBAN en sous-texte pour émetteur/créateur si dispo */
      const bank=(field==='emetteur'||field==='createur')?getBankForName(it,field):null;
      d.innerHTML=`<div><mark>${val}</mark>${it.slice(val.length)}</div>${bank&&bank.iban?`<div style="font-size:11px;color:var(--text3);font-family:var(--mono)">${bank.iban}</div>`:''}`;
      d.onmousedown=e=>{
        e.preventDefault();inp.value=it;list.remove();idx=-1;
        if(field==='iban'){
          const bics=getACData('bic');
          const bicInp=document.getElementById('cr-bic');
          if(bicInp&&bics.length)bicInp.value=bics[0]||'';
        }
        if(field==='emetteur'||field==='createur') fillBankFields(it, field);
        if(field==='emetteur'&&inp._autofill)inp._autofill(it);
      };
      list.appendChild(d);
    });
    idx=-1;
    inp.parentNode.appendChild(list);
  }
  inp.addEventListener('input',()=>{show(inp.value);});
  inp.addEventListener('blur',()=>{
    setTimeout(()=>{const l=document.getElementById('ac-'+inputId);if(l)l.remove();},150);
    /* Remplissage auto IBAN/BIC si le nom est reconnu exactement */
    if(field==='emetteur'||field==='createur') fillBankFields(inp.value, field);
  });
  inp.addEventListener('keydown',e=>{
    const list=document.getElementById('ac-'+inputId);
    if(!list)return;
    const items=list.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,items.length-1);items.forEach((x,i)=>x.classList.toggle('selected',i===idx));}
    else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,-1);items.forEach((x,i)=>x.classList.toggle('selected',i===idx));}
    else if(e.key==='Enter'&&idx>=0){
      e.preventDefault();
      const txt=items[idx].querySelector('div')?.textContent||items[idx].textContent;
      inp.value=txt;list.remove();idx=-1;
      if(field==='emetteur'||field==='createur') fillBankFields(txt, field);
      if(field==='emetteur'&&inp._autofill)inp._autofill(txt);
    }
    else if(e.key==='Escape'){list.remove();idx=-1;}
  });
}

// ─── CALCULS ──────────────────────────────────────────────────────
function calcRetroRestant(){
  let provisionne=0;
  D.campagnes.forEach(c=>{
    const fc=getFcByCamp(c.id);
    const ca=fc.reduce((s,f)=>s+f.montant_ht,0);
    provisionne+=ca*(c.retrocession_pct||0)/100;
  });
  const utilise=D.retrocessions_paiements.reduce((s,p)=>s+p.montant_ht,0);
  return{provisionne,utilise,restant:provisionne-utilise};
}

function calcMarge(cid){
  const fc=getFcByCamp(cid),crs=getCrByCamp(cid),fr=getFrByCamp(cid);
  const camp=getCamp(cid);
  /* Seules les vraies factures (pas les FC fictives) comptent dans le CA réel */
  const realFc=fc.filter(f=>!isFakeFC(f));
  const ca_ht_fact=realFc.reduce((s,f)=>s+f.montant_ht,0);
  const ca_ht=ca_ht_fact||(camp.budget_ht||0);
  const ca_reel=ca_ht_fact>0; /* true = facture réelle, false = estimation budget */
  const createurs=crs.reduce((s,c)=>s+c.montant_ht,0);
  const createurs_payes=crs.filter(c=>c.statut==='paye').reduce((s,c)=>s+c.montant_ht,0);
  const frais=fr.reduce((s,f)=>s+f.montant_ht,0);
  const frais_payes=fr.filter(f=>f.paye).reduce((s,f)=>s+f.montant_ht,0);
  const retro=ca_ht*(camp.retrocession_pct||0)/100;
  const charges=createurs+frais+retro;
  const charges_payees=createurs_payes+frais_payes;
  return{ca_ht,ca_reel,ca_ht_fact,createurs,createurs_payes,frais,frais_payes,retro,charges,charges_payees,marge:ca_ht-charges};
}

function updateHeader(){

}

function del(col,id,e){
  if(e)e.stopPropagation();
  if(!confirm('Supprimer cet élément ?'))return;
  D[col]=D[col].filter(x=>x.id!==id);save();
  if(curCampId)openCampDetail(curCampId);else renderCampagnes();
}

function delCamp(cid){
  if(!confirm('Supprimer cette campagne et toutes ses données ?'))return;
  ['campagnes','createurs','frais','factures_clients'].forEach(k=>{
    if(k==='campagnes')D[k]=D[k].filter(x=>x.id!==cid);
    else D[k]=D[k].filter(x=>x.campagne_id!==cid);
  });
  save();closeModal();renderCampagnes();
}

function saveCamp(editId){
  const nom=document.getElementById('f-nom').value.trim();if(!nom)return alert('Nom requis.');
  const agence=document.getElementById('f-agence').value.trim();if(!agence)return alert('Agence requise.');
  const vals={nom,agence,budget_ht:parseFloat(document.getElementById('f-budget').value)||0,tva_agence:parseFloat(document.getElementById('f-tva').value)||20,retrocession_pct:parseFloat(document.getElementById('f-retro').value)||0,statut:document.getElementById('f-statut').value,date_facture_emission:document.getElementById('f-fem').value,date_facture_echeance:document.getElementById('f-fech').value,type_campagne:document.getElementById('f-type-camp').value};
  if(editId){Object.assign(getCamp(editId),vals);}else{D.campagnes.unshift({id:uid(),note:'',...vals});}
  save();closeModal();if(editId&&curCampId)openCampDetail(editId);else renderCampagnes();
}

      const known=getCreateurInfosExistantes(val);
      if(!known.iban&&!known.siret)return;
      const fill=(id,v)=>{const el=document.getElementById(id);if(el&&!el.value&&v!==undefined&&v!=='')el.value=v;};
      fill('cr-cr',        known.createur||'');
      fill('cr-adresse',   known.adresse||'');
      fill('cr-siret',     known.siret||'');
      fill('cr-tva-intra', known.tva_intra||'');
      fill('cr-iban',      known.iban||'');
      fill('cr-bic',       known.bic||'');
      if(known.tva!==undefined){const s=document.getElementById('cr-tva');if(s)s.value=known.tva?'1':'0';}

    }
    const emEl=document.getElementById('cr-em');
    if(emEl){
      emEl.addEventListener('blur',()=>autofillCreateur(emEl.value));
      emEl._autofill=autofillCreateur;
    }

    /* Auto-fill date paiement 45j */
    const mt=document.getElementById('cr-mt');

          const d=new Date();d.setDate(d.getDate()+45);
          dp.value=d.toISOString().split('T')[0];
        }
      });
    }
  },0);
}


function saveCr(cid,editId){

  if(!mt)return alert('Le montant est requis.');

  const crData={
    campagne_id:cid,

    nom:em,
    createur:document.getElementById('cr-cr').value.trim(),
    handle:document.getElementById('cr-cr').value.trim(),

    type_contenus:document.getElementById('cr-type').value.trim(),

    date_paiement_reel:'',
  };

    adresse:document.getElementById('cr-adresse').value.trim(),
    siret:document.getElementById('cr-siret').value.trim(),
    tva_intra:document.getElementById('cr-tva-intra').value.trim(),

    marque:document.getElementById('cr-marque').value.trim(),

    budget_media:parseFloat(document.getElementById('cr-budmed').value)||0,

    /* Statut contrat : devis_valide automatique à la création */
    statut: editId?(getContrat(editId)||{}).statut||'devis_valide':'devis_valide',
  };

function applyDateLogic(item,val,isCr){
  item.date_paiement_reel=val;
  if(val){if(val<=today())item.statut='paye';}
  else{const ech=isCr?item.date_paiement_souhaite:item.date_echeance;item.statut=isOverdue(ech,'')?'retard':'attente';}
}
function isCampTerminable(cid){
  /* Toutes les factures clients réelles encaissées */
  const fc=getRealFC(cid);
  if(!fc.length)return false; /* pas de facture = pas terminée */
  const fcOK=fc.every(f=>f.statut==='paye');
  /* Tous les créateurs payés */
  const crs=getCrByCamp(cid);
  const crsOK=!crs.length||crs.every(c=>c.statut==='paye');
  /* Tous les frais payés */
  const frs=getFrByCamp(cid);
  const frsOK=!frs.length||frs.every(f=>f.paye);
  return fcOK&&crsOK&&frsOK;
}

function autoTermine(cid){
  const c=getCamp(cid);
  if(!c.id)return;
  if(c.statut==='annule')return; /* ne pas toucher les campagnes annulées */
  if(isCampTerminable(cid)&&c.statut!=='termine'){
    c.statut='termine';
    save();
  }
}

function setStatutPaie(col,id,statut){
  const arr=col==='factures_clients'?D.factures_clients:D.createurs;
  const item=arr.find(x=>x.id===id);if(!item)return;
  item.statut=statut;
  if(statut==='paye'&&!item.date_paiement_reel)item.date_paiement_reel=today();
  if(statut!=='paye')item.date_paiement_reel='';
  /* Vérifier si la campagne est entièrement soldée */
  const cid=item.campagne_id;
  if(cid)autoTermine(cid);
  save();renderPaiements();
}
function setStatutFrais(id,paye){
  const f=D.frais.find(x=>x.id===id);
  if(f){
    f.paye=paye;
    if(f.campagne_id)autoTermine(f.campagne_id);
    save();renderPaiements();
  }
}
function setVirement(id,checked){if(!D.virements)D.virements={};D.virements[id]=checked?'saisi':'a_saisir';save();renderPaiements();}

/* Convertit JJ/MM/AAAA → AAAA-MM-JJ (ISO) et valide */
function parseDisplayDate(s){
  if(!s||!s.trim())return'';
  const p=s.trim().split('/');
  if(p.length!==3)return null;
  const [j,m,a]=[p[0].padStart(2,'0'),p[1].padStart(2,'0'),p[2]];
  if(a.length!==4||isNaN(Date.parse(`${a}-${m}-${j}`)))return null;
  return`${a}-${m}-${j}`;
}
/* Convertit AAAA-MM-JJ → JJ/MM/AAAA pour affichage dans le champ texte */
function isoToDisplay(iso){
  if(!iso)return'';
  const[y,m,j]=iso.split('-');return`${j}/${m}/${y}`;
}

function onDateTextChange(col,id,inputEl){
  const raw=inputEl.value;
  if(!raw.trim()){onDateChange(col,id,'');return;}
  const iso=parseDisplayDate(raw);
  if(iso===null){inputEl.style.borderColor='var(--danger-bd)';return;}
  inputEl.style.borderColor='';
  onDateChange(col,id,iso);
}

function onDateChange(col,id,val){
  const isC=col==='createurs';
  const arr=isC?D.createurs:D.factures_clients;
  const item=arr.find(x=>x.id===id);if(!item)return;
  applyDateLogic(item,val,isC);save();renderPaiements();
}

/* Masque de saisie : autorise seulement chiffres + / et insère les / automatiquement */
function setupDateMask(el){
  el.addEventListener('input',function(){
    let v=this.value.replace(/[^\d]/g,'');
    if(v.length>8)v=v.slice(0,8);
    let out='';
    if(v.length>0)out+=v.slice(0,2);
    if(v.length>2)out+='/'+v.slice(2,4);
    if(v.length>4)out+='/'+v.slice(4,8);
    this.value=out;
    this.style.borderColor='';
  });
  el.addEventListener('blur',function(){
    if(this.value&&parseDisplayDate(this.value)===null)this.style.borderColor='var(--danger-bd)';
  });
}

/* Rendu d'un champ date saisie libre pour les toggles paiement */
function dateField(col,id,isoVal){
  const uid_f='df_'+id.slice(-6)+'_'+col.slice(0,2);
  return`<div style="display:flex;align-items:center;gap:6px">
    <label style="font-size:11px;color:var(--text2);white-space:nowrap">Date réelle :</label>
    <input id="${uid_f}" type="text" class="date-il" placeholder="JJ/MM/AAAA" value="${isoToDisplay(isoVal)}"
      style="width:110px;font-family:var(--mono)"
      onblur="onDateTextChange('${col}','${id}',this)"
      onkeydown="if(event.key==='Enter')onDateTextChange('${col}','${id}',this)">
    <button class="btn btn-sm" style="padding:3px 7px;font-size:11px" onclick="clearDate('${col}','${id}')">✕</button>
  </div>`;
}

function clearDate(col,id){onDateChange(col,id,'');}

/* Après rendu, applique les masques sur tous les champs date */
function applyDateMasks(){
  document.querySelectorAll('input.date-il[placeholder="JJ/MM/AAAA"]').forEach(setupDateMask);
}

function togFc(f){
  /* Auto-passage en retard si échéance dépassée et pas encore payé */
  const autoRetard=f.statut==='attente'&&isOverdue(f.date_echeance,f.date_paiement_reel);
  if(autoRetard&&f.statut!=='retard'){f.statut='retard';save();}
  const s=f.statut;
  return`<div style="display:flex;flex-direction:column;gap:6px">
  <div class="stog">
    <button class="${s==='attente'?'is-active c-attente':''}" onclick="setStatutPaie('factures_clients','${f.id}','attente')">En attente</button>
    <button class="${s==='retard'?'is-active c-retard':''}" onclick="setStatutPaie('factures_clients','${f.id}','retard')">Retard</button>
    <button class="${s==='paye'?'is-active c-paye':''}" onclick="setStatutPaie('factures_clients','${f.id}','paye')">Encaissé</button>
  </div>
  ${dateField('factures_clients',f.id,f.date_paiement_reel)}
</div>`;}

function togCr(cr){
  /* Auto-passage en retard si échéance dépassée et pas encore payé */
  const autoRetard=cr.statut==='attente'&&isOverdue(cr.date_paiement_souhaite,cr.date_paiement_reel);
  if(autoRetard&&cr.statut!=='retard'){cr.statut='retard';save();}
  const s=cr.statut;
  return`<div style="display:flex;flex-direction:column;gap:6px">
  <div class="stog">
    <button class="${s==='attente'?'is-active c-attente':''}" onclick="setStatutPaie('createurs','${cr.id}','attente')">En attente</button>
    <button class="${s==='retard'?'is-active c-retard':''}" onclick="setStatutPaie('createurs','${cr.id}','retard')">Retard</button>
    <button class="${s==='paye'?'is-active c-paye':''}" onclick="setStatutPaie('createurs','${cr.id}','paye')">Payé</button>
  </div>
  ${dateField('createurs',cr.id,cr.date_paiement_reel)}
</div>`;}

function togFr(f){return`<div class="stog">
  <button class="${!f.paye?'is-active c-attente':''}" onclick="setStatutFrais('${f.id}',false)">En attente</button>
  <button class="${f.paye?'is-active c-paye':''}" onclick="setStatutFrais('${f.id}',true)">Payé</button>
</div>`;}

function autoFillIban(){
  let changed=false;
  D.createurs.forEach(cr=>{
    if(cr.iban)return;
    const nom=(cr.emetteur||cr.nom||'').toLowerCase();
    const match=D.createurs.find(x=>x.id!==cr.id&&x.iban&&(
      (nom&&(x.emetteur||x.nom||'').toLowerCase()===nom)
    ));
    if(match){cr.iban=match.iban;cr.bic=match.bic||'';changed=true;}
  });
  if(changed)save();
}

function saveFicheCreateur(emetteur){
  const lignes=D.createurs.filter(cr=>(cr.emetteur||cr.nom||'')===emetteur);
  if(!lignes.length)return;
  const newEm=document.getElementById('fc-em').value.trim();
  const newCr=document.getElementById('fc-cr').value.trim();
  const newIban=document.getElementById('fc-iban').value.trim();
  const newBic=document.getElementById('fc-bic').value.trim();
  const newTva=document.getElementById('fc-tva').value==='1';
  const adresse=document.getElementById('fc-adresse').value.trim();
  const siret=document.getElementById('fc-siret').value.trim();
  const tva_intra=document.getElementById('fc-tva-intra').value.trim();
  /* Mettre à jour toutes les lignes du créateur */
  lignes.forEach(cr=>{
    cr.emetteur=newEm; cr.nom=newEm;
    cr.createur=newCr; cr.handle=newCr;
    cr.iban=newIban; cr.bic=newBic;
    cr.tva=newTva;
    /* Mettre à jour les infos contrat pour chaque opération */
    const ct=getContrat(cr.id)||{};
    setContrat(cr.id,{...ct, adresse, siret, tva_intra});
  });
  save();
  openFicheCreateur(newEm);
}

      return (cr.emetteur||'').toLowerCase().includes(q)
          || (cr.createur||cr.handle||'').toLowerCase().includes(q)
          || (camp.nom||'').toLowerCase().includes(q)
          || (cr.ref_facture||'').toLowerCase().includes(q);
    });

function renderPaiements(){
  const el=document.getElementById('page-paiements');
  const MOIS_FR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  function moisKey(iso){return iso?iso.slice(0,7):'9999-13';}
  function moisLabel(key){if(!key||key==='9999-13')return'Sans date';const[y,m]=key.split('-');return`${MOIS_FR[parseInt(m,10)-1]} ${y}`;}

  const sfc=[...D.factures_clients].sort((a,b)=>(a.date_echeance||'9')>(b.date_echeance||'9')?1:-1);
  const tEA=D.factures_clients.filter(f=>f.statut!=='paye').reduce((s,f)=>s+f.montant_ttc,0);
  const tEE=D.factures_clients.filter(f=>f.statut==='paye').reduce((s,f)=>s+f.montant_ttc,0);
  const tSA=D.createurs.filter(c=>c.statut!=='paye').reduce((s,c)=>s+c.montant_ht,0);
  const tSP=D.createurs.filter(c=>c.statut==='paye').reduce((s,c)=>s+c.montant_ht,0);
  const nR=D.factures_clients.filter(f=>f.statut==='retard').length;

function saveRetro(){
  const desc=document.getElementById('rp-desc').value.trim();if(!desc)return alert('Description requise.');
  const mt=parseFloat(document.getElementById('rp-mt').value)||0;if(!mt)return alert('Montant requis.');
  D.retrocessions_paiements.push({id:uid(),description:desc,montant_ht:mt,date:document.getElementById('rp-date').value,agence:document.getElementById('rp-agence').value});
  save();closeModal();renderRetrocessions();
}

function delRetro(id){
  if(!confirm('Supprimer ce paiement du pot ?'))return;
  D.retrocessions_paiements=D.retrocessions_paiements.filter(x=>x.id!==id);
  save();renderRetrocessions();
}


// ─── ONE CO & TVA ─────────────────────────────────────────────────
function renderOneco(){
  const el=document.getElementById('page-oneco');
  if(!D.factures_oneco)D.factures_oneco=[];
  const MOIS_FR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  function moisLabel(key){if(!key||key==='9999-13')return'Sans date';const[y,m]=key.split('-');return`${MOIS_FR[parseInt(m,10)-1]} ${y}`;}
  function moisKey(iso){return iso?iso.slice(0,7):'9999-13';}

  /* ── TVA collectée ONE CO : factures ONE CO → ANDROMA encaissées ── */
  const tvaCollMap={};
  D.factures_oneco.filter(f=>f.statut==='paye'&&f.date_paiement_reel).forEach(f=>{
    const mk=moisKey(f.date_paiement_reel);
    if(!tvaCollMap[mk])tvaCollMap[mk]={ht:0,tva:0,ttc:0,items:[]};
    const tva=Math.round(f.montant_ht*0.2);
    const ttc=f.montant_ht+tva;
    tvaCollMap[mk].ht+=f.montant_ht;tvaCollMap[mk].tva+=tva;tvaCollMap[mk].ttc+=ttc;
    tvaCollMap[mk].items.push({label:`Fact. ONE CO ${f.numero}${f.libelle?' — '+f.libelle:''}`,ht:f.montant_ht,tva,ttc,id:f.id});
  });

  /* ── TVA déductible ONE CO : créateurs assujettis payés + frais payés + rétro ── */
  const tvaDedMap={};
  D.createurs.filter(cr=>cr.tva&&cr.statut==='paye'&&cr.date_paiement_reel).forEach(cr=>{
    const mk=moisKey(cr.date_paiement_reel);
    if(!tvaDedMap[mk])tvaDedMap[mk]={ht:0,tva:0,ttc:0,items:[]};
    const ht=crHT(cr),ttc=crTTC(cr),tva=ttc-ht;
    tvaDedMap[mk].ht+=ht;tvaDedMap[mk].tva+=tva;tvaDedMap[mk].ttc+=ttc;
    const c=getCamp(cr.campagne_id);
    tvaDedMap[mk].items.push({label:`${cr.emetteur||cr.nom||'—'} — ${c.nom||'—'}`,ht,tva,ttc});
  });
  D.retrocessions_paiements.filter(p=>p.montant_ht&&p.date).forEach(p=>{
    const mk=moisKey(p.date);
    if(!tvaDedMap[mk])tvaDedMap[mk]={ht:0,tva:0,ttc:0,items:[]};
    const tva=Math.round(p.montant_ht*0.2);const ttc=p.montant_ht+tva;
    tvaDedMap[mk].ht+=p.montant_ht;tvaDedMap[mk].tva+=tva;tvaDedMap[mk].ttc+=ttc;
    tvaDedMap[mk].items.push({label:`Rétro : ${p.description}`,ht:p.montant_ht,tva,ttc});
  });
  D.frais.filter(f=>f.paye&&f.date).forEach(f=>{
    const mk=moisKey(f.date);
    if(!tvaDedMap[mk])tvaDedMap[mk]={ht:0,tva:0,ttc:0,items:[]};
    const tva=Math.round(f.montant_ht*0.2);const ttc=f.montant_ht+tva;
    tvaDedMap[mk].ht+=f.montant_ht;tvaDedMap[mk].tva+=tva;tvaDedMap[mk].ttc+=ttc;
    const c=getCamp(f.campagne_id);
    tvaDedMap[mk].items.push({label:`Frais : ${f.libelle} (${c.nom||'—'})`,ht:f.montant_ht,tva,ttc});
  });

  /* Solde TVA remis à 0 au 01/04/2026 — on ne retient que les mois à partir d'avril 2026 */
  const TVA_CUTOFF='2026-04';
  const allMoisFull=[...new Set([...Object.keys(tvaCollMap),...Object.keys(tvaDedMap)])].sort();
  const allMois=allMoisFull.filter(m=>m>=TVA_CUTOFF);
  const totColl=allMois.reduce((s,mk)=>s+(tvaCollMap[mk]?tvaCollMap[mk].tva:0),0);
  const totDed=allMois.reduce((s,mk)=>s+(tvaDedMap[mk]?tvaDedMap[mk].tva:0),0);
  const solde=totColl-totDed;

  /* Totaux factures ONE CO */
  const totalOnecoHT=D.factures_oneco.reduce((s,f)=>s+f.montant_ht,0);
  const totalOnecoEnc=D.factures_oneco.filter(f=>f.statut==='paye').reduce((s,f)=>s+f.montant_ht,0);
  const totalOnecoAtt=D.factures_oneco.filter(f=>f.statut!=='paye').reduce((s,f)=>s+f.montant_ht,0);

  el.innerHTML=`<div class="section-header">
    <h2 style="margin:0">ONE CO MEDIA — TVA</h2>
    <button class="btn btn-primary" onclick="openModalOneco()">+ Facture ONE CO → Androma</button>
  </div>
  <div class="alert alert-info" style="margin-bottom:1.25rem">
    <strong>Circuit :</strong> ANDROMA INVESTISSEMENT encaisse les clients → refacture ONE CO MEDIA → ONE CO paie les créateurs et frais.<br>
    La TVA collectée de ONE CO est celle de ses factures à ANDROMA. La TVA déductible provient des créateurs assujettis, frais et rétrocessions payés.
  </div>

  <div class="sl">Factures ONE CO → Androma Investissement</div>
  <div class="card" style="margin-bottom:.75rem">
    <div style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1rem">
      <div><div class="metric-label" style="font-size:10px">Total HT émis</div><div style="font-size:18px;font-weight:700">${fmt(totalOnecoHT)}</div></div>
      <div><div class="metric-label" style="font-size:10px">Encaissé HT</div><div style="font-size:18px;font-weight:700;color:var(--success)">${fmt(totalOnecoEnc)}</div></div>
      <div><div class="metric-label" style="font-size:10px">En attente HT</div><div style="font-size:18px;font-weight:700;color:var(--warning)">${fmt(totalOnecoAtt)}</div></div>
    </div>
    ${D.factures_oneco.length===0?`<div class="empty" style="padding:1rem">Aucune facture ONE CO — cliquer "+ Facture ONE CO → Androma"</div>`:`<div class="table-wrap"><table>
      <thead><tr><th style="width:12%">N°</th><th style="width:30%">Libellé / campagnes</th><th style="width:14%">HT</th><th style="width:14%">TVA 20%</th><th style="width:14%">TTC</th><th style="width:10%">Statut</th><th style="width:6%"></th></tr></thead>
      <tbody>${[...D.factures_oneco].sort((a,b)=>(b.date||'')>(a.date||'')?1:-1).map(f=>{
        const tva=Math.round(f.montant_ht*0.2);

          </table>`}

    </div>`;
  }).join('')}`;
}

function openModalOneco(){
  const nextNum=String((D.factures_oneco||[]).length+1).padStart(3,'0');
  const num=`ONECO-${new Date().getFullYear()}-${nextNum}`;
  document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="closeModalIfBg(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title"><span>Nouvelle facture ONE CO → Androma</span><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
    <div class="alert alert-info" style="margin-bottom:1rem;font-size:12px">Facture émise par ONE CO MEDIA à destination d'ANDROMA INVESTISSEMENT. Taux TVA : 20% calculé automatiquement.</div>
    <div class="form-row">
      <div class="field"><label>N° de facture *</label><input id="oc-num" value="${num}"></div>
      <div class="field"><label>Date d'émission *</label><input id="oc-date" type="date" value="${today()}"></div>
    </div>
    <div class="form-row single"><div class="field"><label>Libellé / campagnes concernées</label><input id="oc-lib" placeholder="ex : Campagnes Q1 2026 — Sephora + Nike"></div></div>
    <div class="form-row">
      <div class="field"><label>Montant HT (€) *</label><input id="oc-ht" type="number" placeholder="ex : 45000"></div>
      <div class="field"><label>TVA 20% — calculée</label><input id="oc-tva" type="number" readonly style="opacity:.7"></div>
    </div>
    <div class="form-row">
      <div class="field"><label>Montant TTC</label><input id="oc-ttc" type="number" readonly style="opacity:.7"></div>
      <div class="field"><label>Date d'encaissement par ONE CO</label><input id="oc-paie" type="date"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:1rem">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveOneco()">Enregistrer</button>
    </div>
  </div></div>`;
  const calc=()=>{const h=parseFloat(document.getElementById('oc-ht').value)||0;const tva=Math.round(h*0.2);document.getElementById('oc-tva').value=tva;document.getElementById('oc-ttc').value=h+tva;};
  document.getElementById('oc-ht').addEventListener('input',calc);
}

function saveOneco(){
  const num=document.getElementById('oc-num').value.trim();if(!num)return alert('N° requis.');
  const ht=parseFloat(document.getElementById('oc-ht').value)||0;if(!ht)return alert('Montant requis.');
  const paieDate=document.getElementById('oc-paie').value;
  if(!D.factures_oneco)D.factures_oneco=[];
  D.factures_oneco.push({id:uid(),numero:num,libelle:document.getElementById('oc-lib').value,
    montant_ht:ht,date:document.getElementById('oc-date').value,
    date_paiement_reel:paieDate,statut:paieDate&&paieDate<=today()?'paye':'attente'});
  save();closeModal();renderOneco();
}

function setStatutOneco(id,statut){
  const f=(D.factures_oneco||[]).find(x=>x.id===id);if(!f)return;
  f.statut=statut;
  if(statut==='paye'&&!f.date_paiement_reel)f.date_paiement_reel=today();
  if(statut!=='paye')f.date_paiement_reel='';
  save();renderOneco();
}

function delOneco(id){
  if(!confirm('Supprimer cette facture ONE CO ?'))return;
  D.factures_oneco=(D.factures_oneco||[]).filter(x=>x.id!==id);
  save();renderOneco();
}

// ─── DASHBOARD ────────────────────────────────────────────────────
function renderDashboard(){
  const el=document.getElementById('page-dashboard');
  if(!D.campagnes.length){el.innerHTML=`<h2>Tableau de bord</h2><div class="card"><div class="empty-state"><div class="empty-state-icon">·</div><p style="font-weight:500;color:var(--text)">Aucune donnée</p><button class="btn btn-primary" onclick="showPage('campagnes')">Créer une campagne</button></div></div>`;return;}
  /* CA réel (factures émises) + CA estimé (budget des campagnes sans facture) */
  /* Exclure les factures fictives "FC" du CA réel */
  const realFcAll=D.factures_clients.filter(f=>!isFakeFC(f));
  const ca_ht_fact=realFcAll.reduce((s,f)=>s+f.montant_ht,0);
  const ca_ttc_fact=realFcAll.reduce((s,f)=>s+f.montant_ttc,0);
  /* CA à facturer = campagnes sans vraie facture (y compris celles avec seulement des FC fictives) */
  const ca_ht_budget=D.campagnes.filter(c=>getRealFC(c.id).length===0).reduce((s,c)=>s+(c.budget_ht||0),0);
  const ca_ht=ca_ht_fact+ca_ht_budget;
  const ca_ttc=ca_ttc_fact+Math.round(ca_ht_budget*1.2);
  const caE_ht=realFcAll.filter(f=>f.statut==='paye').reduce((s,f)=>s+f.montant_ht,0);
  const caE_ttc=realFcAll.filter(f=>f.statut==='paye').reduce((s,f)=>s+f.montant_ttc,0);
  const caA_ht=ca_ht-caE_ht; const caA_ttc=ca_ttc-caE_ttc;
  let cCr=0,cCrP=0,cFr=0,cFrP=0,retro=0;
  D.campagnes.forEach(c=>{const m=calcMarge(c.id);cCr+=m.createurs;cCrP+=m.createurs_payes;cFr+=m.frais;cFrP+=m.frais_payes;retro+=m.retro;});
  const cT=cCr+cFr+retro,cP=cCrP+cFrP,cR=cT-cP;
  const cCr_ttc=D.createurs.reduce((s,c)=>s+crTTC(c),0);
  const cCrP_ttc=D.createurs.filter(c=>c.statut==='paye').reduce((s,c)=>s+crTTC(c),0);
  const rv=calcRetroRestant();

  /* Section title style helper */
  function secTitle(label,color,bg){return`<div style="background:${bg};border-left:4px solid ${color};border-radius:var(--r);padding:.5rem 1rem;margin-bottom:8px"><span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:${color}">${label}</span></div>`;}

  /* Months for campagne list */
  const MOIS_FR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  function campMoisKey(c){const fc=getFcByCamp(c.id);const d=fc.length?fc[0].date_emission:c.date_facture_emission;return d?d.slice(0,7):'9999-13';}
  function moisLabel(key){if(!key||key==='9999-13')return'Sans date';const[y,m]=key.split('-');return`${MOIS_FR[parseInt(m,10)-1]} ${y}`;}
  const byMois={};
  D.campagnes.forEach(c=>{const mk=campMoisKey(c);if(!byMois[mk])byMois[mk]=[];byMois[mk].push(c);});

  el.innerHTML=`<h2>Tableau de bord</h2>

  ${secTitle('Chiffre d\'affaires','#0C447C','#EAF3FD')}
  ${(()=>{
    const caFact_ht=D.campagnes.filter(c=>getRealFC(c.id).length===0&&(c.statut==='en-cours'||c.statut==='en-attente')).reduce((s,c)=>s+(c.budget_ht||0),0);
    const caFact_ttc=Math.round(caFact_ht*1.2);
    /* CA en attente = factures réelles émises, non encore encaissées */
    const caAttente_ht=ca_ht_fact-caE_ht;
    const caAttente_ttc=ca_ttc_fact-caE_ttc;
    /* CA TOTAL = encaissé + en attente (émis) + à facturer (budgets) */
    const caTotal_ht=caE_ht+caAttente_ht+caFact_ht;
    const caTotal_ttc=caE_ttc+caAttente_ttc+caFact_ttc;
    return`<div class="metrics" style="grid-template-columns:repeat(4,1fr);margin-bottom:.5rem">
      <div class="metric" style="border:2px solid var(--border2);grid-column:1/-1;background:var(--bg2)">
        <div class="metric-label" style="font-size:11px">CA TOTAL (facturé + à facturer)</div>
        <div style="display:flex;align-items:baseline;gap:10px">
          <div class="metric-value" style="font-size:26px">${fmt(caTotal_ht)}</div>
          <div style="font-size:13px;color:var(--text2)">${fmt(caTotal_ttc)} TTC</div>
        </div>
      </div>
    </div>
    <div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-bottom:1rem">
      <div class="metric">
        <div class="metric-label">✅ Encaissé</div>
        <div class="metric-value pos">${fmt(caE_ht)}</div>
        <div class="metric-sub">${fmt(caE_ttc)} TTC</div>
      </div>
      <div class="metric">
        <div class="metric-label">⏳ En attente de paiement</div>
        <div class="metric-value warn">${fmt(caAttente_ht)}</div>
        <div class="metric-sub">${fmt(caAttente_ttc)} TTC · factures émises</div>
      </div>
      <div class="metric" style="background:var(--info-bg)">
        <div class="metric-label" style="color:var(--info)">📋 À facturer</div>
        <div class="metric-value" style="color:var(--info)">${fmt(caFact_ht)}</div>
        <div class="metric-sub">${fmt(caFact_ttc)} TTC · budgets estimés</div>
      </div>
    </div>`;
  })()}

  ${secTitle('Charges','#791F1F','#FEF0F0')}
  ${(()=>{
    const cCrR=cCr-cCrP;
    /* TTC recalculé directement sur les non-payés pour éviter les incohérences d'arrondi */
    const cCrR_ttc=D.createurs.filter(c=>c.statut!=='paye').reduce((s,c)=>s+crTTC(c),0);
    const cFr_ttc=D.frais.reduce((s,f)=>s+Math.round(f.montant_ht*(1+(f.tva_frais||0)/100)),0);
    const cFrP_ttc=D.frais.filter(f=>f.paye).reduce((s,f)=>s+Math.round(f.montant_ht*(1+(f.tva_frais||0)/100)),0);
    const cFrR_ttc=D.frais.filter(f=>!f.paye).reduce((s,f)=>s+Math.round(f.montant_ht*(1+(f.tva_frais||0)/100)),0);
    /* Rétrocessions : pas de TVA sur les rétros (ce sont des reversements internes) */
    const retro_ttc=retro; /* HT = TTC pour les rétrocessions */
    const cT_ttc=cCr_ttc+cFr_ttc+retro_ttc;
    const cP_ttc=cCrP_ttc+cFrP_ttc; /* les retros ne sont pas "payées" individuellement */
    const cR_ttc=cCrR_ttc+cFrR_ttc+retro_ttc;
    /* Marges : résultat net, pas de TTC applicable — on affiche HT uniquement */
    const mgProj=ca_ht-cT;
    const mgEnc=caE_ht-cP;
    const mgAtt=caA_ht-(cT-cP);
    return`
    <div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-bottom:.75rem">
      <div class="metric"><div class="metric-label">Créateurs total</div><div class="metric-value">${fmt(cCr)}</div><div class="metric-sub">${fmt(cCr_ttc)} TTC</div></div>
      <div class="metric"><div class="metric-label">Créateurs payés</div><div class="metric-value neg">${fmt(cCrP)}</div><div class="metric-sub">${fmt(cCrP_ttc)} TTC</div></div>
      <div class="metric"><div class="metric-label">Créateurs restants</div><div class="metric-value warn">${fmt(cCrR)}</div><div class="metric-sub">${fmt(cCrR_ttc)} TTC</div></div>
    </div>
    <div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-bottom:.75rem">
      <div class="metric"><div class="metric-label">Frais total</div><div class="metric-value">${fmt(cFr)}</div><div class="metric-sub">${fmt(cFr_ttc)} TTC</div></div>
      <div class="metric"><div class="metric-label">Frais payés</div><div class="metric-value neg">${fmt(cFrP)}</div><div class="metric-sub">${fmt(cFrP_ttc)} TTC</div></div>
      <div class="metric"><div class="metric-label">Frais restants</div><div class="metric-value warn">${fmt(cFr-cFrP)}</div><div class="metric-sub">${fmt(cFrR_ttc)} TTC</div></div>
    </div>
    <div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-bottom:1.5rem">
      <div class="metric"><div class="metric-label">Total charges</div><div class="metric-value">${fmt(cT)}</div><div class="metric-sub">${fmt(cT_ttc)} TTC</div></div>
      <div class="metric"><div class="metric-label">Charges payées</div><div class="metric-value neg">${fmt(cP)}</div><div class="metric-sub">${fmt(cP_ttc)} TTC</div></div>
      <div class="metric"><div class="metric-label">Charges restantes</div><div class="metric-value warn">${fmt(cR)}</div><div class="metric-sub">${fmt(cR_ttc)} TTC</div></div>
    </div>

    ${secTitle('Marges','#27500A','#EAF3DE')}
    <div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-bottom:1.5rem">
      <div class="metric"><div class="metric-label">Marge projetée</div><div class="metric-value ${mgProj>=0?'pos':'neg'}">${fmt(mgProj)}</div><div class="metric-sub" style="color:var(--text3)">résultat net HT</div></div>
      <div class="metric"><div class="metric-label">Marge encaissée nette</div><div class="metric-value ${mgEnc>=0?'pos':'neg'}">${fmt(mgEnc)}</div><div class="metric-sub" style="color:var(--text3)">résultat net HT</div></div>
      <div class="metric"><div class="metric-label">Marge à encaisser</div><div class="metric-value ${mgAtt>=0?'warn':'neg'}">${fmt(mgAtt)}</div><div class="metric-sub" style="color:var(--text3)">résultat net HT</div></div>
    </div>

    <div class="card" style="margin-bottom:1.5rem">
      <div class="section-header" style="margin-bottom:.5rem">
        <h3 style="margin:0">Pot rétrocession</h3>
        <div style="display:flex;gap:1rem;font-size:13px;flex-wrap:wrap">
          <span>Provisionné : <strong style="color:var(--warning)">${fmt(rv.provisionne)}</strong> <span style="font-size:11px;color:var(--text3)">${fmt(Math.round(rv.provisionne*1.2))} TTC</span></span>
          <span>Utilisé : <strong style="color:var(--danger)">${fmt(rv.utilise)}</strong> <span style="font-size:11px;color:var(--text3)">${fmt(Math.round(rv.utilise*1.2))} TTC</span></span>
          <span>Restant : <strong style="color:${rv.restant>=0?'var(--success)':'var(--danger)'}">${fmt(rv.restant)}</strong> <span style="font-size:11px;color:var(--text3)">${fmt(Math.round(rv.restant*1.2))} TTC</span></span>

  ${secTitle('Opérations par mois','#633806','#FEF3E2')}

function backupJSON(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  a.href=url;
  a.download='backup_oneco_'+ds+'.json';
  a.click();
  URL.revokeObjectURL(url);
  localStorage.setItem('last_backup_date', d.toDateString());
  setSyncStatus('ok','Backup téléchargé — '+ds);
}

function autoBackupIfNeeded(){
  /* Backup automatique si pas fait aujourd'hui et données non vides */
  if(!D.campagnes||D.campagnes.length===0)return;
  const lastBackup=localStorage.getItem('last_backup_date');
  const today=new Date().toDateString();
  if(lastBackup===today)return;
  /* Attendre 10s après chargement pour ne pas bloquer l'UX */
  setTimeout(()=>{
    if(D.campagnes&&D.campagnes.length>0){
      backupJSON();
      console.log('[BACKUP] Backup automatique quotidien effectué');
    }
  },10000);
}

const CONTRAT_STATUTS = [
  {id:'devis_valide',   label:'Devis validé',       color:'#0891b2', bg:'#ecfeff'},
  {id:'contrat_editer', label:'Contrat à éditer',   color:'#d97706', bg:'#fffbeb'},

];

function getContratStatut(s){return CONTRAT_STATUTS.find(x=>x.id===s)||CONTRAT_STATUTS[0];}

function getContratKey(crId){return crId;}

function getContrat(crId){
  if(!D.contrats)D.contrats={};
  return D.contrats[crId]||null;
}

function setContrat(crId, data){
  if(!D.contrats)D.contrats={};
  D.contrats[crId]={...( D.contrats[crId]||{}), ...data};
  save();
}

/* Auto-renseigne infos créateur depuis d'autres prestations */
function getCreateurInfosExistantes(emetteur){
  if(!emetteur)return {};
  const lc=emetteur.toLowerCase();
  const match=D.createurs.find(c=>{
    const key=getContratKey(c.id);
    const ct=D.contrats&&D.contrats[key];
    return (c.emetteur||'').toLowerCase()===lc && ct && (ct.adresse||ct.siret);
  });
  if(!match)return {};
  const ct=D.contrats[getContratKey(match.id)];
  return {adresse:ct.adresse||'', siret:ct.siret||'', tva_intra:ct.tva_intra||''};
}

/* Créateurs nécessitant un contrat (> 1000€ HT) */
function getCreateursAvecContrat(){
  return D.createurs
    .filter(cr=>cr.montant_ht>=1000)
    .map(cr=>{
      const camp=getCamp(cr.campagne_id);
      const ct=getContrat(cr.id)||{};
      if(!ct.statut)ct.statut='contrat_editer';
      return{cr, camp, ct};
    })
    .sort((a,b)=>{
      const order=['contrat_editer','contrat_envoye','devis_envoye','devis_valide','contrat_valide'];
      return order.indexOf(a.ct.statut)-order.indexOf(b.ct.statut);
    });
}

    <div style="background:var(--warning-bg);border-left:3px solid var(--warning-bd);border-radius:var(--r);padding:8px 14px;margin:14px 0">

    </div>
    <div class="form-row">
      <div class="field"><label>Client (agence)</label><input id="ct-client" value="${(ct.client||camp.agence||'').replace(/"/g,'&quot;')}"></div>
      <div class="field"><label>Marque</label><input id="ct-marque" value="${(ct.marque||'').replace(/"/g,'&quot;')}"></div>

    <div class="form-row">
      <div class="field"><label>Nb contenus</label><input id="ct-nb" type="number" value="${cr.nb_contenus||1}"></div>
      <div class="field"><label>Type de contenus</label><input id="ct-type" value="${(cr.type_contenus||'').replace(/"/g,'&quot;')}"></div>
    </div>
    <div class="form-row single"><div class="field"><label>Plateformes autorisées</label><input id="ct-plat" value="${(ct.plateformes||'').replace(/"/g,'&quot;')}" placeholder="Instagram, TikTok, Facebook"></div></div>
    <div class="form-row">
      <div class="field"><label>Période d'exploitation</label><input id="ct-periode" value="${(ct.periode||'').replace(/"/g,'&quot;')}" placeholder="Juin + Juillet 2026"></div>
      <div class="field"><label>Budget média max (€)</label><input id="ct-budmed" type="number" value="${ct.budget_media||''}"></div>
    </div>
    <div class="form-row single"><div class="field"><label>Date du contrat</label><input id="ct-dcontrat" type="date" value="${ct.date_contrat||''}"></div></div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap">
      <button class="btn" onclick="closeModal()">Fermer</button>
      <button class="btn btn-primary" onclick="saveContratDetailFull('${crId}')">Enregistrer</button>
      <button id="btn-generer" class="btn btn-success" onclick="genererContrat('${crId}')"
        style="${hasAdresse&&hasSiret?'':'opacity:.4;cursor:not-allowed;pointer-events:none'}">📄 Générer .docx</button>
    </div>
  </div></div>`;  setTimeout(()=>{
    const upd=()=>{const b=document.getElementById('btn-generer');if(!b)return;const ok=!!(document.getElementById('ct-adresse')?.value.trim())&&!!(document.getElementById('ct-siret')?.value.trim());b.style.opacity=ok?'1':'0.4';b.style.pointerEvents=ok?'auto':'none';b.style.cursor=ok?'pointer':'not-allowed';};
    document.getElementById('ct-adresse')?.addEventListener('input',upd);
    document.getElementById('ct-siret')?.addEventListener('input',upd);
    upd();
  },50);
}
function saveContratDetailFull(crId){
  const cr=D.createurs.find(x=>x.id===crId);
  if(!cr)return;
  /* Update createur fields */
  cr.emetteur=document.getElementById('ct-em').value.trim();
  cr.nom=cr.emetteur;
  cr.createur=document.getElementById('ct-cr').value.trim();
  cr.handle=cr.createur;
  cr.montant_ht=parseFloat(document.getElementById('ct-mt').value)||cr.montant_ht;
  cr.tva=document.getElementById('ct-tva').value==='1';
  cr.iban=document.getElementById('ct-iban').value.trim();
  cr.bic=document.getElementById('ct-bic').value.trim();
  cr.ref_facture=document.getElementById('ct-ref').value.trim();
  cr.date_facture=document.getElementById('ct-dfact').value;
  cr.date_paiement_souhaite=document.getElementById('ct-dpay').value;
  cr.nb_contenus=parseInt(document.getElementById('ct-nb').value)||1;
  cr.type_contenus=document.getElementById('ct-type').value.trim();
  /* Update contrat fields */
  setContrat(crId,{
    adresse:document.getElementById('ct-adresse').value.trim(),
    siret:document.getElementById('ct-siret').value.trim(),
    tva_intra:document.getElementById('ct-tva-intra').value.trim(),
    client:document.getElementById('ct-client').value.trim(),
    marque:document.getElementById('ct-marque').value.trim(),
    plateformes:document.getElementById('ct-plat').value.trim(),
    periode:document.getElementById('ct-periode').value.trim(),
    budget_media:parseFloat(document.getElementById('ct-budmed').value)||0,
    date_contrat:document.getElementById('ct-dcontrat').value,
  });
  save();
  openContratDetail(crId);
}



async function genererContrat(crId){
  const cr=D.createurs.find(x=>x.id===crId);
  if(!cr)return;
  const camp=getCamp(cr.campagne_id);
  const ct=getContrat(crId)||{};

  /* Vérification champs requis */
  if(!ct.adresse||!ct.siret){
    alert('Veuillez renseigner l\'adresse et le SIRET avant de générer le contrat.');
    return;
  }

  const emetteur=cr.emetteur||cr.nom||'';
  const marque=ct.marque||camp.agence||'';
  /* Fallback: si ct vide, lire depuis cr (données saisies dans fiche créateur) */
  if(!ct.adresse&&cr.adresse)ct.adresse=cr.adresse;
  if(!ct.siret&&cr.siret)ct.siret=cr.siret;

  /* Remplacement des placeholders */
  const platefList=(ct.plateformes||'').split(',').map(p=>p.trim()).filter(Boolean);
  const platefStr=platefList.length?platefList.join(', '):('[Plateformes]');

  const replacements={
    '{{EMETTEUR}}': emetteur,
    '{{ADRESSE}}': ct.adresse||'',
    '{{SIRET}}': ct.siret||'',
    '{{TVA_INTRA}}': cr.tva?(ct.tva_intra||'[N° TVA intra]'):'Non assujetti(e) à la TVA',
    '{{MARQUE}}': marque,
    '{{NB_CONTENUS}}': String(cr.nb_contenus||1),
    '{{TYPE_CONTENUS}}': cr.type_contenus||'contenus',
    '{{PLATEFORMES}}': platefStr,
    '{{PERIODE}}': ct.periode||'[Période]',
    '{{BUDGET_MEDIA}}': ct.budget_media?(new Intl.NumberFormat('fr-FR').format(ct.budget_media)+' €'):'[Budget média]',
    '{{MONTANT_HT}}': new Intl.NumberFormat('fr-FR').format(cr.montant_ht||0),
    '{{DATE_CONTRAT}}': ct.date_contrat?fmtD(ct.date_contrat):'[Date]',
  };

  try{
    /* Décoder le template base64 */
    const binary=atob(CONTRAT_TEMPLATE_B64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);

    /* Ouvrir le zip (docx) */
    const zip=await JSZip.loadAsync(bytes);

    /* Remplacer les placeholders dans document.xml */
    let docXml=await zip.file('word/document.xml').async('string');
    for(const[key,val] of Object.entries(replacements)){
      docXml=docXml.split(key).join(val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
    }
    zip.file('word/document.xml',docXml);

    /* Générer et télécharger */
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const fname='Contrat_'+emetteur.replace(/[^a-zA-Z0-9]/g,'_')+'_x_'+marque.replace(/[^a-zA-Z0-9]/g,'_')+'.docx';
    a.download=fname;
    a.click();
    URL.revokeObjectURL(url);

    /* Passer en "Contrat envoyé" si encore en édition */
    if(ct.statut==='contrat_editer'){setContrat(crId,{statut:'contrat_envoye'});openContratDetail(crId);}

  }catch(e){
    console.error('Erreur génération docx:',e);
    alert('Erreur lors de la génération : '+e.message);
  }
}

async function importerFacturePDF(input, cid){
  const file=input.files[0];
  if(!file)return;
  const statusEl=document.getElementById('pdf-import-status');
  statusEl.style.display='block';
  statusEl.style.background='var(--info-bg)';
  statusEl.style.color='var(--info-bd)';
  statusEl.innerHTML='Lecture du PDF en cours...';

  try{
    const base64=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result.split(',')[1]);
      r.onerror=()=>rej(new Error('Lecture impossible'));
      r.readAsDataURL(file);
    });

    statusEl.innerHTML='Extraction des donnees par IA...';

    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{
          role:'user',
          content:[
            {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
            {type:'text',text:'Extrais les informations de cette facture. Reponds UNIQUEMENT en JSON valide sans markdown. Format: {"emetteur":"nom legal","pseudo":"nom commercial ou vide","adresse":"adresse complete","siret":"SIRET/SIREN sans espaces","tva_intra":"numero TVA intra ou vide","tva_assujetti":false,"iban":"IBAN sans espaces","bic":"BIC","montant_ht":0,"montant_ttc":0,"ref_facture":"","date_facture":"YYYY-MM-DD","type_contenus":"description courte","nb_contenus":1}'}
          ]
        }]
      })
    });

    if(!resp.ok)throw new Error('API '+resp.status);
    const data=await resp.json();
    const raw=data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    let info;
    try{info=JSON.parse(raw.replace(/```json|```/g,'').trim());}
    catch(e){throw new Error('Reponse non parseable');}

    const fill=(id,v)=>{const el=document.getElementById(id);if(el&&v!==undefined&&v!==null&&String(v)!=='')el.value=v;};

    /* Vérifier doublon : même émetteur + même réf. facture */
    const doublon=D.createurs.find(cr=>
      (cr.emetteur||cr.nom||'').toLowerCase()===(info.emetteur||'').toLowerCase()&&
      cr.ref_facture&&info.ref_facture&&
      cr.ref_facture===info.ref_facture
    );
    if(doublon){
      /* Même facture déjà saisie — compléter les infos manquantes sur TOUTES les lignes du créateur */
      const memeEmetteur=D.createurs.filter(cr=>(cr.emetteur||cr.nom||'').toLowerCase()===(info.emetteur||'').toLowerCase());
      let nbMaj=0;
      memeEmetteur.forEach(cr=>{
        /* Compléter les champs manquants sur le créateur */
        if(!cr.iban&&info.iban){cr.iban=info.iban;nbMaj++;}
        if(!cr.bic&&info.bic){cr.bic=info.bic;nbMaj++;}
        /* Compléter les champs contrat manquants */
        const ct=getContrat(cr.id)||{};
        const ctUpdate={};
        if(!ct.adresse&&info.adresse){ctUpdate.adresse=info.adresse;nbMaj++;}
        if(!ct.siret&&info.siret){ctUpdate.siret=info.siret;nbMaj++;}
        if(!ct.tva_intra&&info.tva_intra){ctUpdate.tva_intra=info.tva_intra;nbMaj++;}
        if(Object.keys(ctUpdate).length>0)setContrat(cr.id,ctUpdate);
      });
      if(nbMaj>0){save();
        statusEl.style.background='var(--success-bg)';
        statusEl.style.color='var(--success)';
        statusEl.innerHTML='Facture deja saisie — '+nbMaj+' information'+( nbMaj>1?'s':'')+' manquante'+(nbMaj>1?'s':'')+' completee'+(nbMaj>1?'s':'')+' sur toutes les prestations de '+info.emetteur+'.';
      } else {
        statusEl.style.background='var(--info-bg)';
        statusEl.style.color='var(--info-bd)';
        statusEl.innerHTML='Facture deja saisie — toutes les informations sont deja renseignees pour '+info.emetteur+'.';
      }
      return;
    }

    /* Chercher si le createur est deja connu (meme emetteur) */
    const known=getCreateurInfosExistantes(info.emetteur);
    const existingCr=D.createurs.find(cr=>(cr.emetteur||cr.nom||'').toLowerCase()===(info.emetteur||'').toLowerCase());

    fill('cr-em',info.emetteur);
    fill('cr-cr',info.pseudo||(existingCr?existingCr.createur||existingCr.handle:''));
    /* Priorité : infos PDF > infos existantes > vide */
    fill('cr-adresse',info.adresse||known.adresse);
    fill('cr-siret',info.siret||known.siret);
    fill('cr-tva-intra',info.tva_intra||known.tva_intra);
    fill('cr-iban',info.iban||known.iban);
    fill('cr-bic',info.bic||known.bic);
    fill('cr-mt',info.montant_ht);
    fill('cr-ref',info.ref_facture);
    fill('cr-dfact',info.date_facture);
    fill('cr-type',info.type_contenus);
    fill('cr-nb',info.nb_contenus||1);
    const tvaSel=document.getElementById('cr-tva');
    if(tvaSel)tvaSel.value=info.tva_assujetti?'1':'0';
    if(info.date_facture){
      const d=new Date(info.date_facture);
      d.setDate(d.getDate()+45);
      fill('cr-dpay',d.toISOString().split('T')[0]);
    }

    /* Message selon si createur connu ou nouveau */
    statusEl.style.background='var(--success-bg)';
    statusEl.style.color='var(--success)';
    if(existingCr){
      statusEl.innerHTML='Createur reconnu — informations completees automatiquement. Verifiez et ajoutez campagne + marque.';
    } else {
      statusEl.innerHTML='Nouveau createur — champs pre-remplis. Completez campagne, marque, plateformes...';
    }
  }catch(e){
    statusEl.style.background='var(--danger-bg)';
    statusEl.style.color='var(--danger)';
    statusEl.innerHTML='Erreur : '+e.message;
  }
}
</script>
